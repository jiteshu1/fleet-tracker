<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EWR Group — Fleet Tracker</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7a1f33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EWR Fleet">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    color-scheme: light;
    --ink:#1c2430; --ink-soft:#4a5568; --line:#dfe3e8; --paper:#f6f7f5;
    --card:#ffffff; --accent:#7a1f33; --accent-ink:#4a1220; --bar:#1c2430;
    --st-unassigned:#2f9e57; --st-loading:#7b4fb0; --st-loaded:#d9772e;
    --st-transit:#2a6fb0; --st-unloading:#c78a1f; --st-service:#c0392b;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --ink:#e7ecf5; --ink-soft:#94a1ba; --line:#233149; --paper:#080d18;
    --card:#101a2d; --accent:#c23a5a; --accent-ink:#ff9fb6; --bar:#0a0f1c;
    --st-unassigned:#22e07a; --st-loading:#b98bff; --st-loaded:#ffb84d;
    --st-transit:#4fc3ff; --st-unloading:#ffd166; --st-service:#ff5c7a;
  }
  *{box-sizing:border-box;}
  body,input,select,textarea,button{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{background:var(--paper);transition:background .15s ease;}
  html[data-theme="dark"] body{background:#05080f;}
  .app{max-width:480px;margin:0 auto;background:var(--paper);min-height:100vh;color:var(--ink);}
  .topbar{position:sticky;top:0;z-index:5;background:var(--bar);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .logo{width:36px;height:36px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;cursor:pointer;letter-spacing:.3px;}
  .topbar .brandwrap{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .topbar .brand{font-size:16px;font-weight:700;letter-spacing:.2px;}
  .topbar .brand small{display:block;font-weight:400;font-size:11px;color:#b9c0cc;letter-spacing:.3px;text-transform:none;}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.3px;text-transform:uppercase;}
  .status-pill{flex:1 1 45%;padding:9px 6px;border-radius:8px;border:1.5px solid var(--line);text-align:center;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.2px;}
  .iconbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;}
  .iconbtn:active{transform:scale(.97);}
  .content{padding:14px 14px 90px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  label{display:block;font-size:11.5px;color:var(--accent-ink);margin:10px 0 4px;font-weight:800;letter-spacing:.2px;text-transform:uppercase;}
  html[data-theme="dark"] label{color:var(--accent);}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14.5px;background:var(--card);color:var(--ink);}
  textarea{resize:vertical;min-height:56px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;width:100%;}
  .btn:active{transform:scale(.985);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-ghost{background:transparent;}
  .btn-danger{color:#a3311a;border-color:#e8c3b6;}
  html[data-theme="dark"] .btn-danger{color:#ff8a8a;border-color:#5a2530;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .btn-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .btn-grid .btn{flex:1 1 calc(50% - 4px);}
  .err{color:#a3311a;font-size:12.5px;margin-top:6px;}
  html[data-theme="dark"] .err{color:#ff8a8a;}
  .muted{color:var(--ink-soft);font-size:12.5px;}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.2px;}
  .truck-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--st-unassigned);border-radius:10px;padding:9px 12px;margin-bottom:8px;cursor:pointer;}
  .truck-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .truck-no{font-size:15px;font-weight:700;}
  .truck-route{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .truck-meta{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:6px;font-size:12.5px;color:var(--ink-soft);line-height:1.35;}
  .truck-meta span i{font-style:normal;color:var(--ink);font-weight:600;}
  .truck-gps{align-items:flex-start;gap:5px;margin-top:4px;padding-top:6px;border-top:1px dashed var(--line);}
  .truck-gps .ic{margin-top:1px;color:var(--ink-soft);}
  .tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px;}
  .tab{flex:1;text-align:center;padding:9px 4px;font-size:13px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;cursor:pointer;}
  .tab.active{color:var(--accent-ink);border-bottom-color:var(--accent);}
  .fab{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:12px 14px;background:linear-gradient(to top,var(--paper) 60%,transparent);}
  .search{margin-bottom:10px;}
  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
  h2{font-size:16px;margin:0 0 2px;}
  h3{font-size:14px;margin:0;}
  .backlink{color:var(--ink-soft);font-size:13px;cursor:pointer;display:inline-block;margin-bottom:10px;}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .mfl-form-section{font-size:12px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--accent-ink);
    background:color-mix(in srgb, var(--accent) 10%, transparent);border-left:3px solid var(--accent);
    padding:7px 10px;border-radius:6px;margin:22px 0 8px;}
  html[data-theme="dark"] .mfl-form-section{color:var(--accent);}
  .mfl-form-section:first-of-type{margin-top:4px;}
  .tp-calc-box{padding:10px 11px;border:1.5px dashed var(--accent);border-radius:8px;font-size:14.5px;font-weight:800;
    color:var(--accent-ink);background:color-mix(in srgb, var(--accent) 8%, transparent);}
  html[data-theme="dark"] .tp-calc-box{color:var(--accent);}
  .kv:last-child{border-bottom:none;}
  .kv b{color:var(--ink-soft);font-weight:600;}
  .banner{background:#fdf3e9;border:1px solid #f0d9bd;color:#7a4a12;border-radius:9px;padding:9px 11px;font-size:12.5px;margin-bottom:12px;}
  html[data-theme="dark"] .banner{background:#2a2110;border-color:#4a3a16;color:#f0c98a;}
  .status-select-row{display:flex;flex-wrap:wrap;gap:6px;}
  .status-pill{flex:1 1 45%;padding:9px 6px;border-radius:8px;border:1.5px solid var(--line);text-align:center;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
  .status-pill.sel{color:#fff;border-color:transparent;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .userrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .mfl-group{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);}
  .mfl-group-head{padding:10px 13px;cursor:pointer;font-weight:700;font-size:13.5px;background:color-mix(in srgb, var(--accent) 8%, transparent);color:var(--accent-ink);}
  html[data-theme="dark"] .mfl-group-head{color:var(--accent);}
  .mfl-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card);}
  .mfl-table-fullscreen{position:fixed;inset:0;z-index:40;background:var(--card);padding:50px 14px 14px;border-radius:0;}
  .mfl-fullscreen-bar{position:fixed;top:0;left:0;right:0;z-index:41;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;}
  .mfl-table{border-collapse:collapse;width:100%;font-size:12px;min-width:900px;}
  .mfl-table th{background:var(--bar);color:#fff;padding:8px 10px;text-align:left;white-space:nowrap;position:sticky;top:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.2px;}
  .mfl-table th.sortable-th{cursor:pointer;user-select:none;}
  .mfl-table th.sortable-th:hover{background:var(--accent);}
  .mfl-table td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink);}
  .mfl-table tr:last-child td{border-bottom:none;}
  .mfl-table tbody tr{cursor:pointer;}
  .mfl-table tbody tr:hover{background:var(--paper);}

  /* ---------- Business Dashboard: always dark, neon accents ---------- */
  .biz-wrap{background:#070a14;border-radius:14px;padding:16px 14px 22px;}
  .biz-section-title{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#8fa3c9;margin:22px 2px 10px;}
  .biz-section-title:first-child{margin-top:2px;}
  .biz-kpi-row{display:flex;flex-wrap:wrap;gap:10px;}
  .biz-kpi{flex:1 1 42%;min-width:132px;background:#0d1326;border:1px solid #1c2740;border-radius:12px;padding:13px 14px;position:relative;overflow:hidden;}
  .biz-kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--neon,#00e5ff);box-shadow:0 0 10px 1px var(--neon,#00e5ff);}
  .biz-kpi .biz-kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:#8fa3c9;font-weight:700;}
  .biz-kpi .biz-kpi-val{font-size:20px;font-weight:800;color:#f1f5ff;margin-top:4px;text-shadow:0 0 14px color-mix(in srgb, var(--neon,#00e5ff) 55%, transparent);}
  .biz-kpi .biz-kpi-sub{font-size:10.5px;color:#64749c;margin-top:2px;}
  .biz-rank-card{background:#0d1326;border:1px solid #1c2740;border-left:4px solid var(--neon,#00e5ff);border-radius:10px;padding:12px 14px;margin-bottom:9px;}
  .biz-rank-card .biz-rank-label{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:#8fa3c9;font-weight:700;}
  .biz-rank-card .biz-rank-name{font-size:15px;font-weight:800;color:#f1f5ff;margin-top:3px;}
  .biz-rank-card .biz-rank-val{font-size:13px;font-weight:700;margin-top:2px;color:var(--neon,#00e5ff);}
  .biz-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
  .biz-bar-label{width:78px;flex-shrink:0;color:#c3cee6;font-weight:600;}
  .biz-bar-track{flex:1;background:#131b34;border-radius:6px;height:16px;overflow:hidden;}
  .biz-bar-fill{height:100%;border-radius:6px;background:var(--neon,#00e5ff);box-shadow:0 0 8px 0 var(--neon,#00e5ff);}
  .biz-bar-val{width:76px;flex-shrink:0;text-align:right;color:#f1f5ff;font-weight:700;}
  .biz-party-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1c2740;font-size:13px;}
  .biz-party-row:last-child{border-bottom:none;}
  .biz-party-name{color:#e3e9f7;font-weight:600;}
  .biz-empty{color:#64749c;font-size:12.5px;padding:10px 2px;}
  .biz-viewall{font-size:10.5px;color:#4fc3ff;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:700;}
  .biz-viewall:active{opacity:.7;}
  .biz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-bottom:4px;}
  .biz-mini-card{background:#0d1326;border:1px solid #1c2740;border-left:4px solid var(--neon,#00e5ff);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:7px;min-width:0;}
  .biz-mini-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .biz-mini-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:#8fa3c9;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .biz-mini-rank-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:6px;}
  .biz-mini-rank-row>span:first-child{display:flex;align-items:center;color:#e3e9f7;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .biz-mini-rank-row>span:last-child{flex-shrink:0;}
  .biz-mini-rank-badge{width:16px;height:16px;border-radius:50%;background:#1c2740;color:#f1f5ff;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:6px;flex-shrink:0;}
  .biz-mini-hero{font-size:22px;font-weight:800;color:#f1f5ff;text-shadow:0 0 14px color-mix(in srgb, var(--neon,#00e5ff) 55%, transparent);}
  .biz-mini-hero-sub{font-size:10.5px;color:#8fa3c9;}
  .biz-mini-bar-row{display:flex;align-items:center;gap:8px;font-size:11.5px;}
  .biz-mini-bar-label{width:64px;flex-shrink:0;color:#c3cee6;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .biz-mini-bar-track{flex:1;background:#131b34;border-radius:5px;height:12px;overflow:hidden;}
  .biz-mini-bar-fill{height:100%;border-radius:5px;background:var(--neon,#00e5ff);}
  .biz-mini-bar-val{width:58px;flex-shrink:0;text-align:right;color:#f1f5ff;font-weight:700;font-size:11px;}
  .biz-charts-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:760px){.biz-charts-row{grid-template-columns:1fr;}}
  .ofl-filter-bar{background:#0d1326;border:1px solid #1c2740;border-radius:10px;padding:8px 10px;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .ofl-filter-bar select{background:#070a14;border:1px solid #1c2740;color:#e3e9f7;font-size:11.5px;padding:6px 8px;border-radius:7px;flex:1 1 120px;min-width:100px;max-width:170px;}
  .ofl-filter-bar input[type=date]{
    color-scheme:dark; /* this filter bar is always dark-styled regardless of the Day/Night toggle, so the native calendar icon needs to match that, not the page theme */
    background:#070a14;border:1px solid #1c2740;color:#e3e9f7;
    font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px;
    flex:1 1 150px;min-width:140px;max-width:190px;
    letter-spacing:.2px;cursor:pointer;
  }
  .ofl-filter-bar input[type=date]:hover{border-color:#2d3d5c;}
  .ofl-filter-bar input[type=date]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(194,58,90,.25);}
  .ofl-filter-bar input[type=date]::-webkit-calendar-picker-indicator{
    filter:invert(1) brightness(1.7);
    opacity:.8;cursor:pointer;padding:2px;border-radius:4px;
  }
  .ofl-filter-bar input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1;background:#1c2740;}
  .ofl-filter-bar .btn{font-size:11.5px;padding:6px 10px;}
  /* Scoped to Fleet Dispatch's compact toolbar only — lets the free-text
     search box sit inline in the same row instead of forcing its own
     full-width line, without touching .search anywhere else in the app. */
  .ofl-filter-bar input.search{width:auto;flex:1 1 220px;min-width:160px;margin-bottom:0;background:#070a14;border:1px solid #1c2740;color:#e3e9f7;font-size:11.5px;padding:6px 8px;border-radius:7px;}
  .ofl-filter-bar input.search::placeholder{color:#5a6b8c;}
  .ofl-filter-chips{width:100%;font-size:10.5px;color:#8fa3c9;margin-top:2px;}

  .ic{display:inline-block;}

  /* ---------- stat cards (same colorful card design on every screen size) ---------- */
  .stat-row{display:flex;flex-wrap:wrap;gap:8px;}
  .stat-card{flex:1 1 30%;min-width:96px;text-align:left;padding:10px 10px;border-radius:10px;position:relative;
    background:var(--card);border:1px solid var(--line);border-top:3px solid var(--stat-color,var(--accent));
    transition:background .12s ease,box-shadow .12s ease;}
  .stat-card:active{transform:scale(.97);}
  .stat-card.sel{box-shadow:0 0 0 2px var(--stat-color,var(--accent)) inset;}
  .stat-card .stat-icon{display:block;position:absolute;top:8px;right:8px;opacity:.85;color:var(--stat-color,var(--accent));}
  .stat-card .stat-num{font-size:19px;font-weight:700;}
  .stat-card .stat-label{font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.2px;margin-top:1px;}
  html[data-theme="dark"] .stat-card{box-shadow:0 0 0 1px rgba(255,255,255,.02),0 0 14px -7px var(--stat-color,var(--accent));}
  html[data-theme="dark"] .stat-card.sel{box-shadow:0 0 0 2px var(--stat-color,var(--accent)) inset,0 0 14px -7px var(--stat-color,var(--accent));}

  /* ---------- dispatch manager bar + pagination ---------- */
  .dispatch-mgr-bar{padding:12px 12px 10px;}
  .dispatch-mgr-title{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:9px;}
  .dispatch-mgr-row{display:flex;flex-wrap:wrap;gap:8px;}
  .dispatch-mgr-pill{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;border:1.5px solid var(--line);
    font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;background:var(--card);white-space:nowrap;}
  .dispatch-mgr-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .dispatch-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:12px 0;}
  .dispatch-pagination{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .dp-pages{display:flex;gap:4px;flex-wrap:wrap;}
  .dp-page-btn{min-width:30px;height:30px;padding:0 8px;border-radius:7px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .dp-page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .dp-page-btn[disabled]{opacity:.4;cursor:default;}
  .dispatch-bulkbar{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:9px;
    background:color-mix(in srgb, var(--accent) 12%, transparent);border:1px solid var(--accent);font-size:13px;font-weight:700;color:var(--accent-ink);}
  html[data-theme="dark"] .dispatch-bulkbar{color:var(--accent);}
  .dispatch-bulkbar .btn{width:auto;padding:7px 12px;font-size:12.5px;}
  .mfl-select-chk{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .mgrfleet-shell{display:flex;flex-direction:column;gap:12px;}
  .mgr-select-card{padding:10px 12px;}
  .mgr-select-title{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;font-weight:700;margin-bottom:8px;}
  .mgr-select-list{display:flex;flex-wrap:wrap;gap:6px;}
  .mgr-select-item{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .mgr-select-item.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .mgrfleet-main{min-width:0;}

  /* ---------- theme toggle + sidebar credit ---------- */
  .ds-theme-toggle{display:flex;background:#182342;border-radius:9px;padding:3px;margin-bottom:18px;cursor:pointer;}
  .ds-theme-opt{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 4px;border-radius:7px;font-size:11.5px;font-weight:700;color:#7c869c;}
  .ds-theme-opt.active{background:#2b3a63;color:#fff;}
  .ds-credit{font-size:10.5px;color:#5f6a80;text-align:center;padding:10px 4px 2px;letter-spacing:.2px;}

  // Passwords are sent to /api/login (to verify) and /api/data (when an

  // is what hashes and salts them before anything reaches storage; see

  // All data now flows through our own /api/data endpoint (backed by the
  // Supabase SERVICE ROLE key, server-side only) instead of talking to
  // Supabase directly from the browser. authToken is issued by /api/login
  // and lives only in memory for this tab — refreshing the page requires
  // logging in again, same as before.
  var authToken = null;

  async function dbGet(key){
    var res = await fetch("/api/data?key="+encodeURIComponent(key), {
      headers: authToken ? { "Authorization": "Bearer "+authToken } : {}
    });
    if(!res.ok){
      var errBody = await res.json().catch(function(){ return {}; });
      throw new Error(errBody.error || ("DB read failed: "+res.status));
    }
    var data = await res.json();
    return data.value;
  }
  function deepCopy(x){ return x===undefined ? x : JSON.parse(JSON.stringify(x)); }

  async function dbSet(key, value, baseline){
    var payload = {key: key, value: value};
    if(baseline !== undefined) payload.baseline = baseline;
    var res = await fetch("/api/data", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": authToken ? "Bearer "+authToken : ""
      },
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      var errBody = await res.json().catch(function(){ return {}; });
      var err = new Error(errBody.error || ("DB write failed: "+res.status));
      err.status = res.status;
      // 4xx means the server looked at this exact request and deliberately
      // refused it (wrong scope, blocked as an accidental full wipe, bad
      // data, etc) — retrying the identical request 3 times can't change
      // that outcome, it only delays showing the person the real reason.
      // Only 5xx/network-ish failures are worth a retry.
      if(res.status>=400 && res.status<500) err.noRetry = true;
      throw err;
    }
    // The server returns the value it actually wrote — which, for merged
    // keys, may include a concurrent change from someone else that this
    // browser never had. Callers use this to keep their local copy (and
    // next baseline) genuinely in sync with the database.
    return await res.json().catch(function(){ return null; });
  }

  // MONTH-PARTITIONED DATA LAYER (trips / expenses / rtgs_entries / branch_expenses)
  // ---------------------------------------------------------------------
  // These four datasets are now stored server-side as one small chunk per
  // calendar month instead of one giant blob. Everything below exists so
  // the rest of the app can keep reading/writing state.trips, state.expenses,
  // state.rtgsEntries, state.branchExpenses exactly as before (same shape,
  // same fields — no UI/UX change) while only ever loading the months
  // actually needed:
  //   - boot loads just the CURRENT month, so login/first paint stays fast
  //     no matter how much history piles up
  //   - a background prefetch then quietly fills in the rest of the current
  //     fiscal year (April -> current month) so dashboards have it by the
  //     time they're opened, without blocking the initial render
  //   - ensureMonthsLoaded() fetches any further months on demand — meant
  //     to be hooked into date-range filters / search / export so picking
  //     an older range transparently pulls in what it needs
  // If the backend has a dataset flipped back to "single" (legacy) mode,
  // none of this needs to know — the server just returns the whole dataset
  // for a "current month" request in that case, so state.trips ends up
  // with everything either way, and per-month save() calls still work
  // correctly against a single blob too (scopedMerge is id-based, so a
  // partial month-slice as baseline/incoming is exactly as safe as sending
  // a whole-dataset slice — it just costs a few extra small round trips).
  var PARTITIONED_DATE_FIELD = {trips:'date', rtgs_entries:'date', branch_expenses:'date'};
  var PARTITIONED_KEYS = ['trips','expenses','rtgs_entries','branch_expenses'];
  var PARTITIONED_FIELD = {trips:'trips', expenses:'expenses', rtgs_entries:'rtgsEntries', branch_expenses:'branchExpenses'};

  function monthKeyFromDateStr(dateStr){
    if(typeof dateStr !== "string") return "unknown";
    var m = /^(\d{4}-\d{2})-\d{2}/.exec(dateStr.trim());
    return m ? m[1] : "unknown";
  }
  function currentMonthKey(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  }
  // April -> the given month (defaults to the current month): the
  // fiscal-year-to-date list of month keys for an Apr-Mar fiscal year.
  function fiscalYearMonthsUpTo(monthKey){
    monthKey = monthKey || currentMonthKey();
    var parts = monthKey.split("-"), y = parseInt(parts[0],10), m = parseInt(parts[1],10);
    var fyStartYear = (m>=4) ? y : y-1;
    var months = [], cy = fyStartYear, cm = 4, guard = 0;
    while((cy<y || (cy===y && cm<=m)) && guard<24){
      months.push(cy+"-"+String(cm).padStart(2,"0"));
      cm++; if(cm>12){ cm=1; cy++; } guard++;
    }
    return months;
  }
  // Every calendar month touched by [dateFromStr, dateToStr] (inclusive) —
  // for hooking an explicit user-picked date range up to ensureMonthsLoaded().
  function monthsBetween(dateFromStr, dateToStr){
    if(!dateFromStr || !dateToStr) return [];
    var from = dateFromStr.slice(0,7), to = dateToStr.slice(0,7);
    if(!/^\d{4}-\d{2}$/.test(from) || !/^\d{4}-\d{2}$/.test(to)) return [];
    var months = [], y=parseInt(from.slice(0,4),10), m=parseInt(from.slice(5,7),10);
    var ey=parseInt(to.slice(0,4),10), em=parseInt(to.slice(5,7),10), guard=0;
    while((y<ey || (y===ey && m<=em)) && guard<600){
      months.push(y+"-"+String(m).padStart(2,"0"));
      m++; if(m>12){ m=1; y++; } guard++;
    }
    return months;
  }
  function bucketByMonth(list, dateField){
    var buckets = {};
    (list||[]).forEach(function(r){
      if(!r) return;
      var mk = monthKeyFromDateStr(r[dateField]);
      (buckets[mk] = buckets[mk] || []).push(r);
    });
    return buckets;
  }

  async function dbGetMonths(key, months){
    if(!months.length) return {};
    var res = await fetch("/api/data?key="+encodeURIComponent(key)+"&months="+encodeURIComponent(months.join(",")), {
      headers: authToken ? { "Authorization": "Bearer "+authToken } : {}
    });
    if(!res.ok){
      var errBody = await res.json().catch(function(){ return {}; });
      throw new Error(errBody.error || ("DB read failed: "+res.status));
    }
    var data = await res.json();
    // Legacy/"single" mode on the server ignores `months` and returns the
    // whole dataset under `value` instead of `values` — nothing to merge in
    // here in that case, since boot's per-month request already got it all.
    return data.values || {};
  }

  async function dbSetMonth(key, month, value, baseline){
    var payload = {key:key, month:month, value:value};
    if(baseline !== undefined) payload.baseline = baseline;
    var res = await fetch("/api/data", {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization": authToken ? "Bearer "+authToken : "" },
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      var errBody = await res.json().catch(function(){ return {}; });
      var err = new Error(errBody.error || ("DB write failed: "+res.status));
      err.status = res.status;
      if(res.status>=400 && res.status<500) err.noRetry = true;
      throw err;
    }
    return await res.json().catch(function(){ return null; });
  }

  // Fetches whichever of `months` aren't already loaded for `key`, merges
  // their records into state[field]/state._baseline, and marks them
  // loaded. Safe to call repeatedly — already-loaded months are a no-op.
  // Returns true if it actually fetched anything (so the caller knows
  // whether a re-render is worthwhile).
  async function ensureMonthsLoaded(key, months){
    var field = PARTITIONED_FIELD[key];
    var need = (months||[]).filter(function(m){ return !state._loadedMonths[key][m]; });
    if(!need.length) return false;
    var values;
    try{ values = await dbGetMonths(key, need); }
    catch(e){ console.error("ensureMonthsLoaded failed for '"+key+"':", e); return false; }

    if(key === 'expenses'){
      var types = ['fuel','service','adblue','salary','challan'];
      state._baseline.expenses = state._baseline.expenses || {fuel:[],service:[],adblue:[],salary:[],challan:[]};
      need.forEach(function(m){
        var raw = values[m];
        var parsed = raw ? JSON.parse(raw) : {fuel:[],service:[],adblue:[],salary:[],challan:[]};
        types.forEach(function(t){
          state.expenses[t] = (state.expenses[t]||[]).concat(parsed[t]||[]);
          state._baseline.expenses[t] = (state._baseline.expenses[t]||[]).concat(deepCopy(parsed[t]||[]));
        });
        state._loadedMonths.expenses[m] = true;
      });
    } else {
      need.forEach(function(m){
        var raw = values[m];
        var parsed = raw ? JSON.parse(raw) : [];
        state[field] = (state[field]||[]).concat(parsed);
        state._baseline[key] = (state._baseline[key]||[]).concat(deepCopy(parsed));
        state._loadedMonths[key][m] = true;
      });
    }
    return true;
  }

  async function loadCriticalMonth(key, month, emptyVal){
    var field = PARTITIONED_FIELD[key];
    try{
      var res = await fetch("/api/data?key="+encodeURIComponent(key)+"&month="+encodeURIComponent(month), {
        headers: authToken ? { "Authorization": "Bearer "+authToken } : {}
      });
      if(!res.ok){ var eb = await res.json().catch(function(){ return {}; }); throw new Error(eb.error || ("DB read failed: "+res.status)); }
      var data = await res.json();
      var parsed = data.value ? JSON.parse(data.value) : emptyVal;
      state[field] = parsed;
      state._baseline[key] = deepCopy(parsed);
      state._loadedMonths[key][month] = true;
    }catch(e){
      console.error("Load failed for '"+key+"' (month "+month+"):", e);
      state.loadFailedKeys[key] = true;
      state[field] = emptyVal; // used only to render *something*; save-blocking is what protects the data
    }
  }

  // Builds a save*() function for a month-partitioned, array-shaped
  // dataset (trips, rtgs_entries, branch_expenses). Unlike the flat
  // makeSave() below, one logical save can touch more than one month's
  // chunk at once — most commonly because a record's date was edited into
  // a different month. Each touched month is saved as its own request;
  // months that grew (or stayed the same size) are saved before months
  // that shrank, so a mid-way failure leaves a harmless duplicate rather
  // than a record that briefly vanishes from both places.
  function makeMonthlySave(key, dateField){
    var field = PARTITIONED_FIELD[key];
    return function(){
      return guardedSave(key, async function(){
        var incomingByMonth = bucketByMonth(state[field], dateField);
        var baselineByMonth = bucketByMonth(state._baseline[key], dateField);
        var months = {};
        Object.keys(incomingByMonth).forEach(function(m){ months[m]=true; });
        Object.keys(baselineByMonth).forEach(function(m){ months[m]=true; });
        var monthList = Object.keys(months).sort(function(a,b){
          var da = (incomingByMonth[a]||[]).length - (baselineByMonth[a]||[]).length;
          var db = (incomingByMonth[b]||[]).length - (baselineByMonth[b]||[]).length;
          return db - da; // growing/unchanged months first, shrinking months last
        });

        var newFlatState = state[field].filter(function(r){ return !months[monthKeyFromDateStr(r[dateField])]; });
        var newFlatBaseline = (state._baseline[key]||[]).filter(function(r){ return !months[monthKeyFromDateStr(r[dateField])]; });

        for(var i=0;i<monthList.length;i++){
          var m = monthList[i];
          var incoming = incomingByMonth[m] || [];
          var baseline = baselineByMonth[m] || [];
          var resp = await dbSetMonth(key, m, JSON.stringify(incoming), JSON.stringify(baseline));
          var merged = (resp && typeof resp.value === "string") ? JSON.parse(resp.value) : incoming;
          newFlatState = newFlatState.concat(merged);
          newFlatBaseline = newFlatBaseline.concat(deepCopy(merged));
          state._loadedMonths[key][m] = true;
        }
        state[field] = newFlatState;
        state._baseline[key] = newFlatBaseline;
      })();
    };
  }

  // Same idea, but for `expenses`, whose per-month chunk is
  // {fuel:[],service:[],adblue:[],salary:[],challan:[]} rather than a
  // plain array.
  function makeMonthlyExpensesSave(){
    var types = ['fuel','service','adblue','salary','challan'];
    return function(){
      return guardedSave('expenses', async function(){
        var incomingByMonth = {}, baselineByMonth = {}, months = {};
        types.forEach(function(t){
          var inc = bucketByMonth(state.expenses[t], 'date');
          var base = bucketByMonth((state._baseline.expenses||{})[t], 'date');
          Object.keys(inc).forEach(function(m){ (incomingByMonth[m]=incomingByMonth[m]||{})[t]=inc[m]; months[m]=true; });
          Object.keys(base).forEach(function(m){ (baselineByMonth[m]=baselineByMonth[m]||{})[t]=base[m]; months[m]=true; });
        });
        function chunkCount(bucket, m){
          var o = bucket[m]||{};
          return types.reduce(function(s,t){ return s+((o[t]||[]).length); }, 0);
        }
        var monthList = Object.keys(months).sort(function(a,b){
          var da = chunkCount(incomingByMonth,a) - chunkCount(baselineByMonth,a);
          var db = chunkCount(incomingByMonth,b) - chunkCount(baselineByMonth,b);
          return db - da;
        });

        var newState = {}, newBaseline = {};
        types.forEach(function(t){
          newState[t] = (state.expenses[t]||[]).filter(function(r){ return !months[monthKeyFromDateStr(r.date)]; });
          newBaseline[t] = ((state._baseline.expenses||{})[t]||[]).filter(function(r){ return !months[monthKeyFromDateStr(r.date)]; });
        });

        for(var i=0;i<monthList.length;i++){
          var m = monthList[i];
          var incomingChunk = {}; types.forEach(function(t){ incomingChunk[t] = (incomingByMonth[m]||{})[t] || []; });
          var baselineChunk = {}; types.forEach(function(t){ baselineChunk[t] = (baselineByMonth[m]||{})[t] || []; });
          var resp = await dbSetMonth('expenses', m, JSON.stringify(incomingChunk), JSON.stringify(baselineChunk));
          var merged = (resp && typeof resp.value === "string") ? JSON.parse(resp.value) : incomingChunk;
          types.forEach(function(t){
            newState[t] = newState[t].concat(merged[t]||[]);
            newBaseline[t] = newBaseline[t].concat(deepCopy(merged[t]||[]));
          });
          state._loadedMonths.expenses[m] = true;
        }
        state.expenses = newState;
        state._baseline.expenses = newBaseline;
      })();
    };
  }

  // Fires once right after boot (current month only, so login/first paint
  // stays fast), then quietly fills in the rest of the current fiscal year
  // in the background for dashboards. Deliberately not awaited by loadAll().
  async function prefetchFiscalYearInBackground(){
    var fy = fiscalYearMonthsUpTo();
    var any = false;
    for(var i=0;i<PARTITIONED_KEYS.length;i++){
      var key = PARTITIONED_KEYS[i];
      if(state.loadFailedKeys[key]) continue; // don't compound an already-broken load
      try{
        var got = await ensureMonthsLoaded(key, fy);
        if(got) any = true;
      }catch(e){ console.error("Fiscal-year prefetch failed for '"+key+"':", e); }
    }
    if(any) render();
  }

  // ---- Reaching data outside the current fiscal year ----
  // For screens with an existing date-range picker (Own Fleet Dashboard,
  // Business Dashboard, Branch Dashboard, Branch Dispatch expenses), picking
  // an older range should just work — this quietly loads whatever months
  // that range touches, for whichever dataset(s) that screen depends on,
  // then re-renders once the data's actually in. `keys` may be a single
  // dataset key or an array of them.
  function maybeLoadRangeMonths(keys, dateFrom, dateTo){
    var months = monthsBetween(dateFrom, dateTo);
    if(!months.length) return;
    var list = Array.isArray(keys) ? keys : [keys];
    list.forEach(function(k){ state._rangeLoading[k] = true; });
    render();
    return Promise.all(list.map(function(k){ return ensureMonthsLoaded(k, months); }))
      .then(function(results){ list.forEach(function(k){ state._rangeLoading[k] = false; }); render(); return results.some(Boolean); })
      .catch(function(e){ console.error("maybeLoadRangeMonths failed:", e); list.forEach(function(k){ state._rangeLoading[k] = false; }); render(); });
  }
  // A small warning banner for any screen whose export could otherwise fire
  // mid-load and silently produce an incomplete file for the picked range.
  function rangeLoadingBanner(keys){
    var list = Array.isArray(keys) ? keys : [keys];
    return list.some(function(k){ return state._rangeLoading[k]; })
      ? '<div class="banner">Loading additional months for the selected date range — export is paused until this finishes…</div>'
      : '';
  }

  // For screens that only have a text search box (Fleet Dispatch, Branch
  // Dispatch RTGS, Expenses) — no date range there to piggyback on, so a
  // small explicit "load older data" control does the same job.
  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function monthLabel(m){
    if(m==='unknown') return 'No date recorded';
    var parts = m.split('-');
    return MONTH_NAMES[parseInt(parts[1],10)-1]+' '+parts[0];
  }
  async function discoverMonthsFor(key){
    try{
      var res = await fetch("/api/data?key="+encodeURIComponent(key)+"&discoverMonths=1", {
        headers: authToken ? { "Authorization": "Bearer "+authToken } : {}
      });
      if(!res.ok) return [];
      var data = await res.json();
      return data.months || [];
    }catch(e){ console.error("discoverMonthsFor failed for '"+key+"':", e); return []; }
  }
  function renderLoadOlderControl(key){
    if(!state._olderMonthsOpen[key]){
      return '<div style="margin:0 0 10px;">'+
        '<span class="link" data-act="toggle-older-months" data-key="'+key+'" style="cursor:pointer;color:var(--accent,#00b8d9);font-size:12.5px;">'+icon('download',13)+' Load older data (outside this fiscal year)</span></div>';
    }
    var discovered = (state._discoveredMonths[key]||[]).filter(function(m){ return !state._loadedMonths[key][m]; });
    var html = '<div class="ofl-filter-bar" style="margin-bottom:10px;">';
    if(discovered.length===0){
      html += '<span style="font-size:11.5px;color:#9aa7c7;">Everything on record is already loaded.</span>';
    } else {
      html += '<select id="older-months-select-'+key+'">';
      discovered.slice().reverse().forEach(function(m){ html += '<option value="'+m+'">'+monthLabel(m)+'</option>'; });
      if(discovered.length>1) html += '<option value="__all__">All of the above</option>';
      html += '</select>';
      html += '<button class="btn btn-ghost" style="width:auto;flex:0 0 auto;background:#070a14;border-color:#1c2740;color:#e3e9f7;" data-act="load-older-month" data-key="'+key+'">Load</button>';
    }
    if(state._olderMonthsNote[key]) html += '<span style="font-size:11.5px;color:#9aa7c7;">'+esc(state._olderMonthsNote[key])+'</span>';
    html += '</div>';
    return html;
  }

  // "Export a specific date range" — for the screens whose search box has
  // no date filter to piggyback on. Loads whatever months the picked range
  // touches (if not already loaded), then writes an Excel file straight
  // from the data (not from the on-screen table, which is paginated) —
  // so the export always has the complete range, not just one page of it.
  // Reuses .ofl-filter-bar — the same compact, dark toolbar style every
  // other date-range filter in the app already uses — rather than plain
  // full-width inputs, which is what made this control take up far more
  // room than it needed to.
  function renderRangeExportControl(key){
    var from = state._rangeExportFrom[key] || "";
    var to = state._rangeExportTo[key] || "";
    var html = '<div class="ofl-filter-bar" style="margin-bottom:14px;">';
    html += '<span style="font-size:11.5px;color:#9aa7c7;font-weight:600;white-space:nowrap;">'+icon('download',13)+' Export range</span>';
    html += '<input type="date" min="2015-01-01" max="2035-12-31" id="rangeexport-from-'+key+'" value="'+esc(from)+'">';
    html += '<span style="color:#5a6b8c;font-size:13px;">→</span>';
    html += '<input type="date" min="2015-01-01" max="2035-12-31" id="rangeexport-to-'+key+'" value="'+esc(to)+'">';
    html += '<button class="btn btn-ghost" style="width:auto;flex:0 0 auto;background:#070a14;border-color:#1c2740;color:#e3e9f7;" data-act="export-range-excel" data-key="'+key+'"'+(state._rangeLoading[key]?' disabled':'')+'>'+icon('download',13)+' Export</button>';
    if(state._rangeLoading[key]) html += '<span style="font-size:11.5px;color:#9aa7c7;">Loading…</span>';
    else if(state._rangeExportNote[key]) html += '<span style="font-size:11.5px;color:#9aa7c7;">'+esc(state._rangeExportNote[key])+'</span>';
    html += '</div>';
    return html;
  }

  function writeRangeExcelFile(rows, columns, filenamePrefix, dateFrom, dateTo){
    if(typeof XLSX==="undefined") return { ok:false, error:"Export tool load nahi hua, internet check karo." };
    if(!rows.length) return { ok:false, error:"No records in that date range." };
    var data = rows.map(function(r){
      var o = {};
      columns.forEach(function(c){ o[c.label] = c.get(r); });
      return o;
    });
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Fleet tracking");
    XLSX.writeFile(wb, filenamePrefix+"-"+dateFrom+"_to_"+dateTo+".xlsx");
    return { ok:true, count: rows.length };
  }

  // Datasets where "failed to load" must NEVER be allowed to quietly become
  // "treat it as empty and let the user carry on" — a later save of that
  // key would then overwrite real, possibly thousands-of-records data with
  // an empty/partial array. company_logo/gps_sync_url/photos are excluded:
  // losing those for one session is a cosmetic inconvenience, not lost
  // business records.
  var CRITICAL_KEYS = ['users','trucks','drivers','managers','companies','trips','branches','rtgs_entries','expenses','branch_expenses'];

  async function loadAll(){
   try{
    state.loadFailedKeys = {};
    async function loadCritical(key, assign, emptyVal){
      try{
        var raw = await dbGet(key);
        var parsed = raw ? JSON.parse(raw) : emptyVal;
        assign(parsed);
        state._baseline[key] = deepCopy(parsed);
      }catch(e){
        console.error("Load failed for '"+key+"':", e);
        state.loadFailedKeys[key] = true;
        assign(emptyVal); // used only to render *something*; save-blocking below is what actually protects the data
        // deliberately no _baseline set here — guardedSave already blocks
        // saving this key until a successful reload, so it's never used.
      }
    }
    await loadCritical('users', function(v){ state.users=v; }, []);
    await loadCritical('trucks', function(v){ state.trucks=v; }, []);
    await loadCritical('drivers', function(v){ state.drivers=v; }, []);
    await loadCritical('managers', function(v){ state.managers=v; }, []);
    await loadCritical('companies', function(v){ state.companies=v; }, []);
    // trips/expenses/rtgs_entries/branch_expenses are month-partitioned —
    // boot only ever loads the CURRENT month, so this stays fast no matter
    // how much history exists. prefetchFiscalYearInBackground() (below)
    // quietly fills in the rest of the fiscal year right after.
    var CM = currentMonthKey();
    await loadCriticalMonth('trips', CM, []);
    await loadCritical('branches', function(v){ state.branches=v; }, []);
    await loadCriticalMonth('rtgs_entries', CM, []);
    await loadCriticalMonth('branch_expenses', CM, []);
    await loadCriticalMonth('expenses', CM, {fuel:[], service:[], adblue:[], salary:[], challan:[]});
    // Non-critical: safe to soft-fail to a default, nothing business-critical is lost either way.
    try{ var lg = await dbGet('company_logo'); state.companyLogo = lg || ""; }catch(e){ state.companyLogo = ""; }
    try{ var gs = await dbGet('gps_sync_url'); state.gpsSyncUrl = gs || ""; }catch(e){ state.gpsSyncUrl = ""; }
    try{ var ph = await dbGet('photos'); state.photos = ph ? JSON.parse(ph) : {}; }catch(e){ state.photos = {}; }

    state.booted = true;
    render();
    if(Object.keys(state.loadFailedKeys).length===0) startAutoSync();
    prefetchFiscalYearInBackground(); // fire-and-forget; re-renders itself once it has data
   }catch(fatal){
     console.error("Boot failed:", fatal);
     var el = document.getElementById('app');
     if(el){
       el.innerHTML = '<div style="max-width:480px;margin:40px auto;padding:20px;font-family:sans-serif;color:#a3311a;background:#fff3f0;border:1px solid #e8c3b6;border-radius:10px;">'+
         '<b>App load nahi hua.</b><br><br>Error: '+String((fatal&&fatal.message)||fatal)+
         '<br><br>Yeh error Claude ko bhej dijiye, isse pata chal jayega exact wajah.</div>';
     }
   }
  }

  // Every save* function funnels through here first. If that dataset failed
  // to load this session, its in-memory copy may be empty/stale — refusing
  // to save is what stops "database read hiccup" from silently turning into
  // "your trips table just got wiped". The only way past this is a reload
  // that successfully re-reads the real data from the server.
  function guardedSave(key, doSave){
    return async function(){
      if(state.loadFailedKeys[key]){
        var err = new Error("Save blocked: '"+key+"' failed to load this session.");
        err.noRetry = true;
        err.handled = true;
        state.toast = "Couldn't save — \""+key+"\" is paused because its data didn't load correctly this session (to avoid overwriting real records with an incomplete copy). Please reload the page, then try again.";
        render();
        throw err;
      }
      await doSave();
    };
  }

  // Builds a save*() function for a mergeable dataset: sends this browser's
  // last-known baseline alongside its edited copy, then — critically —
  // syncs state.<field> and the baseline itself from whatever the server
  // says it actually wrote. That last step is what picks up a concurrent
  // change made by someone else in between this browser's load and save,
  // instead of the browser silently staying one step behind until its next
  // full reload.
  function makeSave(apiKey, getVal, setVal){
    return function(){
      return guardedSave(apiKey, async function(){
        var baselineVal = state._baseline[apiKey];
        var baselineStr = baselineVal !== undefined ? JSON.stringify(baselineVal) : undefined;
        var resp = await dbSet(apiKey, JSON.stringify(getVal()), baselineStr);
        if(resp && typeof resp.value === "string"){
          var merged = JSON.parse(resp.value);
          setVal(merged);
          state._baseline[apiKey] = deepCopy(merged);
        } else {
          // Unexpected/older response shape — fall back to trusting our own
          // copy rather than leaving the baseline stale.
          state._baseline[apiKey] = deepCopy(getVal());
        }
      })();
    };
  }

  async function saveUsers(){ await guardedSave('users', async function(){ await dbSet('users', JSON.stringify(state.users)); })(); }
  var saveTrucks = makeSave('trucks', function(){ return state.trucks; }, function(v){ state.trucks=v; });
  var saveDrivers = makeSave('drivers', function(){ return state.drivers; }, function(v){ state.drivers=v; });
  var saveManagers = makeSave('managers', function(){ return state.managers; }, function(v){ state.managers=v; });
  var saveCompanies = makeSave('companies', function(){ return state.companies; }, function(v){ state.companies=v; });
  var saveTrips = makeMonthlySave('trips', 'date');
  var saveBranches = makeSave('branches', function(){ return state.branches; }, function(v){ state.branches=v; });

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  // Resolves silently on success. On definitive failure it sets a clear
  // state.toast AND re-throws, so whatever click handler called this stops
  // dead instead of carrying on to a goBack()/go(...) that would otherwise
  // navigate away as if the save had actually happened.
  async function retrySave(fn, label){
    for(var attempt=1; attempt<=3; attempt++){
      try{ await fn(); if(state.toast){ state.toast=null; render(); } return; }
      catch(e){
        console.error("save failed (attempt "+attempt+"/3): "+label, e);
        if(e && e.noRetry){
          if(!e.handled){
            // A dbSet 4xx — the server looked at this exact request and
            // refused it for a real, specific reason (wrong scope, blocked
            // as an accidental full wipe, bad data, etc). Show that reason
            // directly rather than a generic message, since retrying the
            // identical request 3 times can't change a deliberate refusal.
            state.toast = e.message || ("Couldn't save \""+label+"\".");
            state.pendingRetry = null;
            e.handled = true;
          }
          render();
          throw e;
        }
        if(attempt===3){
          state.toast = "Couldn't save your last change (\""+label+"\") — the server had a hiccup. Try Retry, or check back in a bit.";
          state.pendingRetry = {fn:fn, label:label};
          render();
          e.handled = true;
          throw e;
        }
        await sleep(attempt*700);
      }
    }
  }

      ownFleetFilters: state.ownFleetFilters, ownFleetSortKey: state.ownFleetSortKey, ownFleetSortDir: state.ownFleetSortDir,

    };

  function go(view, extra, noPush){
    if(!noPush && state.view && state.view!=="login"){ state.stack.push(snapshot()); }
    state.view = view;

    if(extra) Object.assign(state, extra);

  function goBack(){
    var prev = state.stack.pop();

  async function login(name, pass){
    var res;
    try{
      res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({name: name.trim(), password: pass})
      });
    }catch(netErr){
      state.error = "Couldn't reach the server. Check your internet connection.";
      render();
      return;
    }
    var body = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      state.error = body.error || "No match. Check name and password, or ask your admin to add you.";
      render();
      return;
    }
    authToken = body.token;
    state.session = {name: body.name, role: body.role};
    state.booted = false; // show the "Loading fleet data…" screen while we fetch, now that we're authenticated
    render();
    await loadAll();
    if(body.mustChangePassword){ go("forcePassword", null, true); return; }
    goHome();
  }

  // ---------- Date-range presets (shared by Own Fleet Dashboard filters) ----------
  function ymd(d){ return d.toISOString().slice(0,10); }
  function dateRangeFromPreset(preset){
    var now = new Date();
    var todayStr = ymd(now);
    if(preset==="today") return {from:todayStr, to:todayStr};
    if(preset==="yesterday"){
      var y = new Date(now); y.setDate(y.getDate()-1);
      return {from:ymd(y), to:ymd(y)};
    }
    if(preset==="thisWeek"){
      var d0 = new Date(now); var day = d0.getDay(); var diff = (day===0?6:day-1); // week starts Monday
      var start = new Date(d0); start.setDate(d0.getDate()-diff);
      return {from:ymd(start), to:todayStr};
    }
    if(preset==="thisMonth"){
      var start2 = new Date(now.getFullYear(), now.getMonth(), 1);
      return {from:ymd(start2), to:todayStr};
    }
    if(preset==="lastMonth"){
      var start3 = new Date(now.getFullYear(), now.getMonth()-1, 1);
      var end3 = new Date(now.getFullYear(), now.getMonth(), 0);
      return {from:ymd(start3), to:ymd(end3)};
    }
    return {from:"", to:""}; // "all" / "custom" (custom uses the stored dateFrom/dateTo directly)
  }

  // Keeps a driver's managerName aligned with whichever manager their assigned
  // truck belongs to, so assigning a vehicle links driver <-> manager both ways.
  function resyncDriverManagers(){
    var changed = false;
    state.trucks.forEach(function(tr){
      if(!tr.driverName) return;
      var mgr = managerOfTruck(tr.id);
      if(!mgr) return;
      var drv = state.drivers.find(function(d){return d.name===tr.driverName;});
      if(drv && drv.managerName!==mgr){ drv.managerName = mgr; changed = true; }
    });
    return changed;
  }

  function driverManagerGroups(){
    var map = {}, noGroup = [];
    state.drivers.forEach(function(d){
      if(d.managerName && state.managers.some(function(m){return m.name===d.managerName;})){
        (map[d.managerName]=map[d.managerName]||[]).push(d);
      } else {
        noGroup.push(d);
      }
    });
    return {map:map, noGroup:noGroup};
  }

  function driverOptionsGrouped(selectedName){
    var g = driverManagerGroups();

  function filteredTrucks(list){
    var q = state.search.trim().toLowerCase();
    return list.filter(function(t){
      var okStatus = state.filterStatus==="all" || t.currentStatus===state.filterStatus;
      var okSearch = !q || (t.truckNo||"").toLowerCase().indexOf(q)>-1 || (t.partyName||"").toLowerCase().indexOf(q)>-1 || (t.driverName||"").toLowerCase().indexOf(q)>-1 || (t.loadedTo||"").toLowerCase().indexOf(q)>-1;
      var okManager = true;
      if(state.filterManager!=="all"){
        var mgr = state.managers.find(function(m){return m.name===state.filterManager;});
        okManager = !!(mgr && (mgr.vehicleIds||[]).indexOf(t.id)>-1);
      }
      return okStatus && okSearch && okManager;
    });
  }

  // Flattens sidebarGroups() into a plain list of clickable items — nested
  // sub-groups (e.g. "Fleet Management") are unwrapped to their children,
  // since those are what's directly navigable; the sub-group header itself
  // isn't a destination on its own.
  function flattenNavItems(groups){
    var out = [];
    groups.forEach(function(g){
      g.items.forEach(function(it){
        if(it.isSubGroup){ (it.items||[]).forEach(function(sub){ out.push(sub); }); }
        else out.push(it);
      });
    });
    return out;
  }

  // A mobile-only "where do I go from here" grid — same purpose as the
  // desktop sidebar, for the one or two screens (like the EWR Dashboard,
  // where every role lands after login) that don't already have their own
  // way to reach other sections on a phone. Placed as a direct child of
  // .content so the existing "hide .btn-grid on desktop" CSS rule applies
  // automatically — the sidebar is what desktop uses instead.
  function renderMobileQuickNav(){
    var items = flattenNavItems(sidebarGroups());
    if(!items.length) return '';
    var html = '<div class="btn-grid" style="margin-bottom:14px;">';
    items.forEach(function(it){
      var extraAttr = it.extra && it.extra.name ? ' data-name="'+esc(it.extra.name)+'"' : '';
      html += '<button class="btn btn-ghost" data-act="'+it.act+'"'+extraAttr+'>'+icon(it.icon)+' '+esc(it.label)+'</button>';
    });
    html += '</div>';
    return html;
  }

  // Desktop-only sidebar. Purely additive: hidden by CSS on phones/narrow
  // screens, so the existing mobile navigation is completely unaffected.
  function renderSidebar(){
    if(!state.session) return '';
    var v = state.view, role = state.session.role;
    var groups = sidebarGroups();
    var topKeys = groups.filter(function(g){return g.label;}).map(function(g){return g.key;});
    var nestedParent = {};
    groups.forEach(function(g){
      g.items.forEach(function(it){ if(it.isSubGroup) nestedParent[it.key] = g.key; });
    });
    state._sidebarTopKeys = topKeys;
    state._sidebarNestedParent = nestedParent;
    var html = '<div class="desktop-sidebar">';
    // The sidebar badge always shows the company logo (or "EG" fallback) —

  function tripsInScope(managerName, companyId){
    // managerName === "__all__" (or falsy) -> every trip. Otherwise only
    // trips whose vehicle currently belongs to that manager's fleet.
    var list = state.trips;
    if(managerName && managerName!=="__all__"){
      var mgr = state.managers.find(function(m){return m.name===managerName;});
      var ids = (mgr && mgr.vehicleIds) || [];
      list = list.filter(function(tr){ return ids.indexOf(tr.truckId)>-1; });
    }
    if(companyId && companyId!=="all"){
      list = list.filter(function(tr){
        var tk = state.trucks.find(function(t){return t.id===tr.truckId;});
        return tk && tk.companyId===companyId;
      });
    }
    return list.slice();
  }

  function renderDashboard(){
    var counts = {};
    STATUS_LIST.forEach(function(s){counts[s]=0;});
    // Counts respect the selected fleet-manager filter — "All fleet managers"
    // counts every truck; picking a manager scopes the counts to their trucks.
    var countScope = state.trucks;
    if(state.filterManager!=="all"){
      var scopeMgr = state.managers.find(function(m){return m.name===state.filterManager;});
      countScope = scopeMgr ? state.trucks.filter(function(t){return (scopeMgr.vehicleIds||[]).indexOf(t.id)>-1;}) : [];
    }
    countScope.forEach(function(t){ counts[t.currentStatus] = (counts[t.currentStatus]||0)+1; });
    var list = filteredTrucks(state.trucks);

    var html = "";
    if(state.session.role==="admin"){
      // Full quick-nav (every section reachable for this role), not just
      // Fleet Tracking's own sub-items — otherwise an admin landing here on
      // a phone (this is now the default mobile landing screen) would be
      // stuck with no way to reach Own Fleet Dispatch, Branch Dispatch,
      // EWR Dashboard, or Companies.
      html += renderMobileQuickNav();
    }

    html += '<div class="card" style="padding:10px 14px;">';
    html += '<div class="stat-row">';
    STATUS_LIST.forEach(function(s){
      var sel = state.filterStatus===s;
      html += '<div class="stat-card'+(sel?' sel':'')+'" data-act="stat-filter" data-status="'+s+'" style="--stat-color:'+STATUS_COLOR[s]+';cursor:pointer;">'+
        '<div class="stat-icon" style="color:'+STATUS_COLOR[s]+'">'+icon(STATUS_ICON[s],20)+'</div>'+
        '<div class="stat-num" style="color:'+STATUS_COLOR[s]+'">'+counts[s]+'</div>'+
        '<div class="stat-label">'+esc(s)+'</div></div>';
    });
    html += '</div></div>';

    html += '<input class="search" id="search" placeholder="Search vehicle no, party, driver, destination" value="'+esc(state.search)+'">';
    html += '<select id="filter-manager" style="margin-bottom:10px;">';
    html += '<option value="all"'+(state.filterManager==="all"?" selected":"")+'>All fleet managers</option>';
    state.managers.forEach(function(m){ html += '<option value="'+esc(m.name)+'"'+(state.filterManager===m.name?" selected":"")+'>'+esc(m.name)+'</option>'; });
    html += '</select>';
    html += '<select id="filter-status" style="margin-bottom:12px;text-transform:capitalize;">';
    html += '<option value="all"'+(state.filterStatus==="all"?" selected":"")+'>All statuses</option>';
    STATUS_LIST.forEach(function(s){ html += '<option value="'+s+'" style="text-transform:uppercase;"'+(state.filterStatus===s?" selected":"")+'>'+esc(s.toUpperCase())+'</option>'; });

    else html += renderVehicleTableBlock(list, {showManagerCol:true, shotId:'mfl-table-shot', emptyText:'No vehicles match. Add one to get started.'});

  function findTruck(id){ return state.trucks.find(function(t){return t.id===id;}); }

  // Central ownership check, used both to show/hide edit controls AND as a
  // guard right before any write — so permission is enforced at the point of
  // action, not just by hiding a button.
  function canEditTruck(t){
    if(!t) return false;
    if(state.session.role==="admin") return true;
    if(state.session.role==="driver") return !!(t.driverName && t.driverName.toLowerCase()===state.session.name.toLowerCase());
    if(state.session.role==="manager") return managerOfTruck(t.id)===state.session.name;
    return false;
  }

  function canEditTrip(trip){
    if(!trip) return false;
    if(state.session.role==="admin") return true;
    if(state.session.role==="manager") return managerOfTruck(trip.truckId)===state.session.name;
    if(state.session.role==="company") return true; // the server already only ever hands this session its own company's trips
    return false;
  }

  // ================= Fleet Expenses (Fuel / Service / Adblue / Salary / Challans) =================
  // One generic system drives all five categories so they share the same
  // manager-scoped dashboard, sort/filter/pagination, bulk select+delete,
  // and add/edit form — only the field list differs per category.
  var EXPENSE_TYPES = {
    fuel: {
      key:"fuel", label:"Fuel Expense", icon:"fuel", scope:"vehicle",
      fields:[
        {key:"date", label:"Date", type:"date"},
        {key:"odometer", label:"Odometer Reading", type:"number", aliases:["ODOMETER","ODO","KM","ODOMETER KM"]},
        {key:"liters", label:"Liters Filled", type:"number", aliases:["LITERS","LITRES","QTY","QUANTITY","LTR","LTRS"]},
        {key:"rate", label:"Rate/Liter (₹)", type:"number", aliases:["RATE","PRICE","RATE PER LITER","PRICE PER LITER","RATE/LITRE"]},

  function expenseAmount(type, exp){
    if(type==="fuel" || type==="adblue") return num(exp.rate) * num(exp.liters);
    return num(exp.amount);
  }

  // Correct real-world mileage calculation: only computable between two
  // FULL-TANK fill-ups (a partial fill alone doesn't tell you how far that
  // fuel actually took the truck). Between those two full tanks, ALL liters
  // added — including any partial top-ups in between — count toward the
  // distance covered, since that's the total fuel actually burned.
  function fuelMileage(exp){
    if(!exp || !exp.truckId || !exp.date) return null;
    if(exp.fullTank!=="Yes") return null; // can only close out a mileage figure on a full tank

    var vehicleEntries = (state.expenses.fuel||[])
      .filter(function(e){ return e.truckId===exp.truckId && e.date; })
      .sort(function(a,b){
        if(a.date!==b.date) return a.date<b.date ? -1 : 1;
        return (a.createdAt||0)-(b.createdAt||0);
      });

    var curIdx = vehicleEntries.findIndex(function(e){ return e.id===exp.id; });
    if(curIdx===-1) return null;

    var prevFullIdx = -1;
    for(var i=curIdx-1;i>=0;i--){
      if(vehicleEntries[i].fullTank==="Yes"){ prevFullIdx = i; break; }
    }
    if(prevFullIdx===-1) return null; // this is the first full tank on record — nothing to compare against yet

    var prevFull = vehicleEntries[prevFullIdx];
    if(num(exp.odometer)<=num(prevFull.odometer)) return null;

    var litersSince = 0;
    for(var j=prevFullIdx+1;j<=curIdx;j++){ litersSince += num(vehicleEntries[j].liters); }
    if(litersSince<=0) return null;

    return (num(exp.odometer)-num(prevFull.odometer)) / litersSince;
  }

    var v = exp[f.key];

    return v || "";
  }

  function extractVehicleList(data){
    if(Array.isArray(data)) return data;
    if(!data || typeof data!=="object") return [];
    var candidates = ['data','result','results','vehicles','items','content'];
    for(var i=0;i<candidates.length;i++){
      if(Array.isArray(data[candidates[i]])) return data[candidates[i]];
    }
    return [];
  }
  function pick(obj, keys){
    for(var i=0;i<keys.length;i++){
      var k = keys[i];
      if(obj[k]!==undefined && obj[k]!==null && obj[k]!=="") return obj[k];
    }
    return null;
  }
  async function syncGpsNow(silent){
    if(!state.gpsSyncUrl){
      if(!silent){ state.gpsSyncNote="Pehle Settings mein Proxy URL daal ke Save karein."; render(); }
      return;
    }
    if(!silent){ state.gpsSyncing = true; state.gpsSyncNote=""; render(); }
    try{
      var base = state.gpsSyncUrl.replace(/\/$/,"");
      var res = await fetch(base + "/live", {
        headers: authToken ? { "Authorization": "Bearer "+authToken } : {}
      });
      if(!res.ok) throw new Error("Proxy ne error diya: "+res.status);
      var data = await res.json();
      var list = extractVehicleList(data);
      if(list.length===0){
        if(!silent) state.gpsSyncNote = "Connect toh ho gaya, lekin koi vehicle record nahi mila response mein.";
      } else {
        var matched = 0;
        list.forEach(function(v){
          var vNo = pick(v, ['vehicleNumber','vehicle_number','regNumber','regnNo','number','vehicleNo','name']);
          if(!vNo) return;
          var norm = String(vNo).replace(/\s+/g,'').toUpperCase();
          var truck = state.trucks.find(function(t){ return (t.truckNo||'').replace(/\s+/g,'').toUpperCase()===norm; });
          if(!truck) return;
          var lat = pick(v, ['latitude','lat','currentLat','gpsLat']);
          var lng = pick(v, ['longitude','lng','currentLng','currentLong','gpsLng','lon']);
          var speed = pick(v, ['speed','currentSpeed','speedKmph','speedKmh']);
          var status = pick(v, ['currentStatus','status','vehicleStatus','ignitionStatus','runningStatus','movementStatus']);
          var odometer = pick(v, ['totalOdometer','odometer','odometerReading','odometerKm','odometerValue']);
          var address = pick(v, ['address','place','locationName','location','currentAddress']);
          var driver = pick(v, ['driverName','driver_name','driver','currentDriverName']);
          var updatedAt = pick(v, ['lastUpdatedAt','lastUpdated','updatedAt','gpsTime','deviceTime','lastPacketTime','timestamp']);
          truck.live = {
            lat: (lat!=null ? parseFloat(lat) : null),
            lng: (lng!=null ? parseFloat(lng) : null),
            speed: speed, status: status, odometer: odometer,
            address: address, driver: driver,
            updatedAt: updatedAt ? (isNaN(Number(updatedAt)) ? Date.parse(updatedAt) : Number(updatedAt)) : Date.now()
          };
          if(lat!=null && lng!=null){ truck.gpsLocation = lat+","+lng; matched++; }
          truck.gpsSyncedAt = Date.now();
        });
        await saveTrucks();
        if(!silent) state.gpsSyncNote = matched>0 ? ("Ho gaya — "+matched+" vehicle sync hui.") : "Connect toh ho gaya, lekin vehicle number match nahi hua kisi truck se.";
      }
      state.lastGpsSync = Date.now();
    }catch(err){
      console.error(err);
      if(!silent) state.gpsSyncNote = "Sync fail hua: "+String((err && err.message) || err);
    }
    if(!silent) state.gpsSyncing = false;
    render();
  }

  var leafletMapInstance = null;
  function initLiveMap(){
    if(typeof L==="undefined") return;
    var el = document.getElementById('live-map-el');
    if(!el) return;
    if(leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; }
    var withGps = state.trucks.filter(function(t){return t.live && t.live.lat!=null && t.live.lng!=null && !isNaN(t.live.lat) && !isNaN(t.live.lng);});
    var center = withGps.length ? [withGps[0].live.lat, withGps[0].live.lng] : [22.9734, 78.6569];
    var zoom = withGps.length ? 6 : 4;
    leafletMapInstance = L.map(el).setView(center, zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
    }).addTo(leafletMapInstance);
    var bounds = [];
    withGps.forEach(function(t){
      var pos = [t.live.lat, t.live.lng];
      bounds.push(pos);
      var popup = '<b>'+esc(t.truckNo||"—")+'</b><br>'+
        (t.driverName?esc(t.driverName)+'<br>':'')+
        (t.live.speed!=null?'Speed: '+esc(t.live.speed)+' km/h<br>':'')+
        (t.live.status?'Status: '+esc(t.live.status)+'<br>':'')+
        (t.live.address?esc(t.live.address)+'<br>':'')+
        (t.live.updatedAt?'<span style="color:#8a8f98;">'+esc(timeAgo(t.live.updatedAt))+'</span>':'');
      L.marker(pos).addTo(leafletMapInstance).bindPopup(popup);
    });
    if(bounds.length>1) leafletMapInstance.fitBounds(bounds, {padding:[30,30]});
  }

  function renderDispatchDashboard(){
    var role = state.session.role;
    // Managers only ever see their own dispatch board — no cross-manager
    // browsing here (unlike Tracking's "All vehicles" view).
    var visibleManagers = role==="manager"
      ? state.managers.filter(function(m){ return m.name===state.session.name; })
      : state.managers.slice();

    if(role==="manager"){
      state.activeManagerName = state.session.name;
    } else if(!state.activeManagerName){
      state.activeManagerName = "__all__";
    }
    if(!state.dispatchCompanyFilter) state.dispatchCompanyFilter = "all";
    var selManager = state.activeManagerName;
    var selCompany = role==="company" ? "all" : state.dispatchCompanyFilter; // company logins: data's already scoped server-side
    var html = "";

    if(visibleManagers.length===0){
      return '<div class="empty">No fleet managers set up yet. Add a manager under Tracking → Managers first.</div>';
    }

    var fullList = tripsInScope(selManager, selCompany);
    var dFrom = state._rangeExportFrom.trips || "", dTo = state._rangeExportTo.trips || "";

    // One compact toolbar: Add trip, Company, Manager, Search, Date range,
    // Clear, Export — all in a single professionally-arranged row that
    // wraps sensibly on narrow screens, instead of several stacked
    // full-width blocks. Nothing about what any of these controls DO has
    // changed — only where and how compactly they're laid out.
    html += '<div class="ofl-filter-bar">';
    html += '<button class="btn btn-primary" style="width:auto;flex:0 0 auto;" data-act="add-trip">'+icon('add',14)+' Add trip</button>';
    if(role!=="company" && state.companies.length>0){
      html += '<select id="dispatch-company-select">';
      html += '<option value="all"'+(selCompany==="all"?" selected":"")+'>Select Company (All)</option>';
      state.companies.forEach(function(c){ html += '<option value="'+esc(c.id)+'"'+(selCompany===c.id?" selected":"")+'>'+esc(c.name)+'</option>'; });
      html += '</select>';
    }
    if(role!=="manager"){
      html += '<select id="dispatch-manager-select">';
      html += '<option value="__all__"'+(selManager==="__all__"?" selected":"")+'>Select Manager (All)</option>';
      visibleManagers.forEach(function(m){ html += '<option value="'+esc(m.name)+'"'+(selManager===m.name?" selected":"")+'>'+esc(m.name)+'</option>'; });
      html += '</select>';
    }
    if(fullList.length>0){
      html += '<input class="search" id="dispatch-search" placeholder="Search LR, challan, truck, from, to, party, bill no…" value="'+esc(state.dispatchFilter)+'">';
    }
    html += '<input type="date" min="2015-01-01" max="2035-12-31" id="rangeexport-from-trips" value="'+esc(dFrom)+'">';
    html += '<span style="color:#5a6b8c;font-size:13px;">→</span>';
    html += '<input type="date" min="2015-01-01" max="2035-12-31" id="rangeexport-to-trips" value="'+esc(dTo)+'">';
    if(state.dispatchFilter || dFrom || dTo){

    html += '<button class="btn btn-ghost" style="width:auto;flex:0 0 auto;background:#070a14;border-color:#1c2740;color:#e3e9f7;" data-act="export-range-excel" data-key="trips"'+(state._rangeLoading.trips?' disabled':'')+'>'+icon('download',13)+' Export</button>';
    html += '</div>';
    if(state._rangeLoading.trips) html += '<div class="banner">Loading additional months for the selected date range…</div>';
    else if(state._rangeExportNote.trips) html += '<div style="font-size:12px;color:var(--muted,#8892a6);margin:-4px 0 8px;">'+esc(state._rangeExportNote.trips)+'</div>';

    html += '<div class="dispatch-toolbar">';
    html += '<div class="row" style="width:auto;">';
    html += '<button class="btn btn-ghost" style="width:auto;" data-act="trigger-import">'+icon('upload',15)+' Upload your data</button>';
    if(fullList.length>0){
      html += '<button class="btn btn-ghost" style="width:auto;" data-act="toggle-table-fullscreen" data-target="dispatch-table-shot">'+icon('expand',15)+' Full screen</button>';
      html += '<button class="btn btn-ghost" style="width:auto;" data-act="download-table-image" data-target="dispatch-table-shot">'+icon('download')+' Export JPG</button>';
      html += '<button class="btn btn-ghost" style="width:auto;" data-act="export-table-excel" data-target="dispatch-table-shot">'+icon('download')+' Export to Excel</button>';
    }
    html += '</div>';
    html += '</div>';
    html += '<input type="file" id="dispatch-import-file" accept=".xlsx,.xls" style="display:none">';
    if(state.dispatchImportNote) html += '<div class="banner">'+esc(state.dispatchImportNote)+'</div>';

    html += renderLoadOlderControl('trips');

    // The date range now actually filters what's on screen (this was the
    // reported bug — it only drove the Excel export before). inDateRange()
    // already tolerates just one side being set (an open-ended range).
    var list = sortTrips(fullList.filter(function(tr){
      return inDateRange(tr.date, dFrom, dTo) && tripMatchesFilter(tr, state.dispatchFilter);
    }));
    if(!state.dispatchSortKey){
      list = list.sort(function(a,b){ return new Date(b.date||b.createdAt||0) - new Date(a.date||a.createdAt||0); });
    }

    if(fullList.length===0){
      html += '<div class="empty">No trips logged yet for the selected filters. Click "Add trip" to start the register.</div>';
    } else if(list.length===0){
      html += '<div class="empty">No trips match "'+esc(state.dispatchFilter)+'".</div>';
    } else {
      var perPage = 50;
      var totalPages = Math.max(1, Math.ceil(list.length/perPage));
      if(state.dispatchPage>totalPages) state.dispatchPage = totalPages;
      if(state.dispatchPage<1) state.dispatchPage = 1;
      var startIdx = (state.dispatchPage-1)*perPage;
      var pageList = list.slice(startIdx, startIdx+perPage);

      // Kept so "select all" can act on every trip matching the current
      // filter/sort — not just the 50 shown on this page.
      state.dispatchAllIds = list.map(function(tr){ return tr.id; });

      var selectedCount = Object.keys(state.dispatchSelected).filter(function(id){ return state.dispatchSelected[id]; }).length;
      if(selectedCount>0){
        html += '<div class="dispatch-bulkbar">'+
          '<span>'+selectedCount+' trip'+(selectedCount>1?'s':'')+' selected</span>'+
