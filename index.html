          '<button class="btn btn-ghost" style="width:auto;" data-act="clear-trip-selection">Clear</button>'+
        '</div>';
      }

      html += renderTripTableBlock(pageList, {shotId:'dispatch-table-shot', hideExportButtons:true, sortable:true, selectable:true, allIds:state.dispatchAllIds});

      html += '<div class="dispatch-pagination">';
      html += '<div class="muted">Showing '+(startIdx+1)+' to '+Math.min(startIdx+perPage,list.length)+' of '+list.length+' entries</div>';
      html += '<div class="dp-pages">';
      html += '<button class="dp-page-btn" data-act="dispatch-page" data-page="'+(state.dispatchPage-1)+'"'+(state.dispatchPage<=1?' disabled':'')+'>«</button>';
      for(var p=1;p<=totalPages;p++){
        if(p===1 || p===totalPages || Math.abs(p-state.dispatchPage)<=1){
          html += '<button class="dp-page-btn'+(p===state.dispatchPage?' active':'')+'" data-act="dispatch-page" data-page="'+p+'">'+p+'</button>';
        } else if(Math.abs(p-state.dispatchPage)===2){
          html += '<span class="muted" style="padding:0 2px;">…</span>';
        }
      }
      html += '<button class="dp-page-btn" data-act="dispatch-page" data-page="'+(state.dispatchPage+1)+'"'+(state.dispatchPage>=totalPages?' disabled':'')+'>»</button>';
      html += '</div></div>';
    }
    return html;
  }

  // Trip money math — mirrors the dispatch register's own formulas exactly:
  //   FREIGHT = RATE × WT           (only when RATE is a number; "FIX" rows enter freight by hand)
  //   BAL     = FREIGHT − COMM − CHARGES − ADV CASH − ADV REC. − TDS
  //   BAL REMAINING = BAL − BAL REC
  //   TOTAL DIST = UNLOADING KM − LOADING KM
  function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function tripFreight(tr){
    var rateNum = parseFloat(tr.rate);
    if(tr.rate!=null && tr.rate!=="" && !isNaN(rateNum)) return rateNum * num(tr.wt);
    return num(tr.freight);
  }
  function tripBal(tr){ return tripFreight(tr) - num(tr.comm) - num(tr.charges) - num(tr.advCash) - num(tr.advRec) - num(tr.tds); }
  function tripBalRemaining(tr){ return tripBal(tr) - num(tr.balRec); }

  // Empty-running detection: for each vehicle, order its trips by odometer
  // (loadingKm, which only ever climbs), then the gap between one trip's
  // UNLOADING km and the next trip's LOADING km is distance the vehicle ran
  // with no load — attributed to the route it had just finished, since that's
  // the route that failed to line up a return load.
  function computeEmptyLegStats(trips){
    var byTruck = {};
    trips.forEach(function(tr){
      if(tr.loadingKm==="" || tr.loadingKm==null || tr.unloadingKm==="" || tr.unloadingKm==null) return;
      if(!byTruck[tr.truckId]) byTruck[tr.truckId]=[];
      byTruck[tr.truckId].push(tr);
    });
    var routeEmpty = {}, totalEmptyKm = 0;
    Object.keys(byTruck).forEach(function(tid){
      var list = byTruck[tid].slice().sort(function(a,b){ return num(a.loadingKm)-num(b.loadingKm); });
      for(var i=0;i<list.length-1;i++){
        var cur=list[i], next=list[i+1];
        var gap = num(next.loadingKm) - num(cur.unloadingKm);
        if(gap>0){
          var key = (cur.from||"?")+" → "+(cur.to||"?");
          if(!routeEmpty[key]) routeEmpty[key]={total:0,count:0};
          routeEmpty[key].total += gap;
          routeEmpty[key].count += 1;
          totalEmptyKm += gap;
        }
      }
    });
    return {routeEmpty:routeEmpty, totalEmptyKm:totalEmptyKm};
  }
  function tripTotalDist(tr){
    if(tr.loadingKm==="" || tr.loadingKm==null || tr.unloadingKm==="" || tr.unloadingKm==null) return "";
    return num(tr.unloadingKm) - num(tr.loadingKm);
  }
  function money(n){ return (Math.round(n*100)/100).toLocaleString('en-IN'); }

  // ---------- Daily Dispatch & RTGS calculations ----------
  function rtgsTotalBooking(r){ return num(r.bookingRate) * num(r.weight); }
  function rtgsTotalLorry(r){ return num(r.lorryRate) * num(r.weight); }
  function rtgsMargin(r){ return rtgsTotalBooking(r) - rtgsTotalLorry(r); }
  function rtgsMarginPct(r){ var tb = rtgsTotalBooking(r); return tb>0 ? (rtgsMargin(r)/tb*100) : 0; }
  function rtgsLorryAdvance(r){ return num(r.advCash) + num(r.tds) + num(r.otherExp1) + num(r.otherExp2) + num(r.advRtgs); }
  function rtgsBalance(r){ return rtgsTotalLorry(r) - rtgsLorryAdvance(r); }

  // ---------- Excel import for the dispatch register ----------
  // Accepts header names in any case/spacing (matches the real EWR sheets:
  // DATE, LR, CHALLAN, TRUCK, FROM, TO, WT, RATE, FREIGHT, DRIVER ADV, COMM,
  // CHARGES, ADV CASH, ADV REC., ADV. REC. DATE, PARTY, TDS, BAL, BAL REC,
  // BAL REC DATE, BAL REMAINING, LOADING KM, UNLOADING KM, TOTAL DIST,
  // BILL NO, BILL DATE). BAL / BAL REMAINING / TOTAL DIST are recomputed by
  // the app anyway, so their columns (if present) are simply ignored.
  var IMPORT_HEADER_MAP = {
    "DATE":"date", "LR":"lr", "CHALLAN":"challan", "TRUCK":"truckNo",
    "FROM":"from", "TO":"to", "WT":"wt", "RATE":"rate", "FREIGHT":"freight",
    "DRIVER ADV":"driverAdv", "COMM":"comm", "CHARGES":"charges",
    "ADV CASH":"advCash", "ADV REC":"advRec", "ADV REC DATE":"advRecDate",
    "PARTY":"party", "TDS":"tds", "BAL REC":"balRec", "BAL REC DATE":"balRecDate",
    "LOADING KM":"loadingKm", "UNLOADING KM":"unloadingKm",
    "BILL NO":"billNo", "BILL DATE":"billDate"
  };
  function normalizeHeader(h){
    return String(h||"").toUpperCase().replace(/\./g,"").replace(/\s+/g," ").trim();
  }
  // Dates are always STORED as ISO "YYYY-MM-DD" (what <input type=date> and
  // the Excel importer both use) so sorting/parsing stays reliable. This only
  // formats them for on-screen/export display, as DD/MM/YYYY.
  function formatDateIN(iso){
    if(!iso) return "";
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
    if(!m) return iso;
    return m[3]+"/"+m[2]+"/"+m[1];
  }

  // Lets the browser breathe every so often during a big synchronous loop
  // (large Excel imports) so the tab doesn't lock up and trigger Chrome's
  // "Page Unresponsive" warning.
  function yieldToBrowser(){ return new Promise(function(resolve){ setTimeout(resolve, 0); }); }

  function excelDateToStr(v){
    if(v==null || v==="") return "";
    if(v instanceof Date) return v.toISOString().slice(0,10);
    if(typeof v==="number"){
      var d = new Date(Math.round((v-25569)*86400*1000));
      return isNaN(d.getTime()) ? "" : d.toISOString().slice(0,10);
    }
    return String(v).trim();
  }

  async function importTripsFromExcel(file, managerName){
    var buf = await file.arrayBuffer();
    var wb = XLSX.read(buf, {type:"array", cellDates:true});
    var sheet = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(sheet, {defval:"", raw:true});

    var fleet = trucksForManager(managerName);
    var truckByNo = {};
    fleet.forEach(function(t){ truckByNo[String(t.truckNo).toUpperCase().replace(/\s+/g,"")] = t.id; });

    // A trip is treated as "the same one already in the register" when its
    // vehicle, date, LR, challan, route and party all match an existing
    // entry — so re-uploading the same sheet (even with a couple of rows
    // added or fixed) only adds what's genuinely new.
    function tripSignature(truckId, o){
      return [truckId, o.date, o.lr, o.challan, o.from, o.to, o.party]
        .map(function(x){ return String(x||"").trim().toUpperCase(); }).join("|");
    }
    var existingSignatures = {};
    state.trips.forEach(function(t){ existingSignatures[tripSignature(t.truckId, t)] = true; });

    var added = 0, skippedNoTruck = 0, skippedEmpty = 0, skippedDuplicate = 0, unmatchedTrucks = {};
    for(var rowIdx=0; rowIdx<rows.length; rowIdx++){
      if(rowIdx>0 && rowIdx%150===0){ state.dispatchImportNote = "Importing… "+rowIdx+" of "+rows.length+" rows"; render(); await yieldToBrowser(); }
      var row = rows[rowIdx];
      var mapped = {};
      Object.keys(row).forEach(function(rawKey){
        var norm = normalizeHeader(rawKey);
        var field = IMPORT_HEADER_MAP[norm];
        if(field) mapped[field] = row[rawKey];
      });
      var hasAnything = Object.keys(mapped).some(function(k){ return mapped[k]!==""; });
      if(!hasAnything){ skippedEmpty++; continue; }

      var truckKey = String(mapped.truckNo||"").toUpperCase().replace(/\s+/g,"");
      var truckId = truckByNo[truckKey];
      if(!truckId){
        skippedNoTruck++;
        if(truckKey) unmatchedTrucks[mapped.truckNo] = true;
        continue;
      }

      var mappedDate = excelDateToStr(mapped.date);
      var sig = tripSignature(truckId, {date:mappedDate, lr:mapped.lr, challan:mapped.challan, from:mapped.from, to:mapped.to, party:mapped.party});
      if(existingSignatures[sig]){ skippedDuplicate++; continue; }
      existingSignatures[sig] = true;

      state.trips.push({
        id: uid(),
        truckId: truckId,
        date: mappedDate,
        lr: String(mapped.lr||""),
        challan: String(mapped.challan||""),
        from: String(mapped.from||""),
        to: String(mapped.to||""),
        wt: mapped.wt!=null ? String(mapped.wt) : "",
        rate: mapped.rate!=null ? String(mapped.rate) : "",
        freight: mapped.freight!=null ? String(mapped.freight) : "",
        driverAdv: mapped.driverAdv!=null ? String(mapped.driverAdv) : "",
        comm: mapped.comm!=null ? String(mapped.comm) : "",
        charges: mapped.charges!=null ? String(mapped.charges) : "",
        advCash: mapped.advCash!=null ? String(mapped.advCash) : "",
        advRec: mapped.advRec!=null ? String(mapped.advRec) : "",
        advRecDate: excelDateToStr(mapped.advRecDate),
        party: String(mapped.party||""),
        tds: mapped.tds!=null ? String(mapped.tds) : "",
        balRec: mapped.balRec!=null ? String(mapped.balRec) : "",
        balRecDate: excelDateToStr(mapped.balRecDate),
        loadingKm: mapped.loadingKm!=null ? String(mapped.loadingKm) : "",
        unloadingKm: mapped.unloadingKm!=null ? String(mapped.unloadingKm) : "",
        billNo: String(mapped.billNo||""),
        billDate: excelDateToStr(mapped.billDate),
        createdAt: Date.now(), createdBy: state.session.name,
        updatedAt: Date.now(), updatedBy: state.session.name
      });
      added++;
    }

    await retrySave(saveTrips, "import trips");

    var note = added+" trip(s) imported for "+managerName+".";
    if(skippedDuplicate>0) note += " "+skippedDuplicate+" row(s) skipped as already in the register.";
    if(skippedNoTruck>0){
      var names = Object.keys(unmatchedTrucks).slice(0,6).join(", ");
      note += " "+skippedNoTruck+" row(s) skipped — vehicle number not found in this manager's fleet ("+names+(Object.keys(unmatchedTrucks).length>6?", …":"")+"). Add these vehicles first, then re-upload.";
    }
    state.dispatchImportNote = note;
    state.dispatchPage = 1;
    render();
  }

  // ---------- Excel import for expense registers (fuel, service, adblue, salary, challan) ----------
  // Header names are matched against each field's own label (e.g. "Odometer
  // Reading", "Liters Filled") plus a "Vehicle"/"Truck" or "Driver" column
  // depending on the expense type — so the same sheet layout you'd naturally
  // export from Excel imports back in without renaming anything.
  function expenseSignature(type, o){
    var cfg = EXPENSE_TYPES[type];
    var parts = [cfg.scope==="vehicle" ? o.truckId : o.driverName];
    cfg.fields.forEach(function(f){ if(!f.auto) parts.push(o[f.key]); });
    return parts.map(function(x){ return String(x||"").trim().toUpperCase(); }).join("|");
  }

  async function importExpensesFromExcel(type, file, managerName){
    var cfg = EXPENSE_TYPES[type];
    var buf = await file.arrayBuffer();
    var wb = XLSX.read(buf, {type:"array", cellDates:true});
    var sheet = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(sheet, {defval:"", raw:true});

    var headerMap = {};
    cfg.fields.forEach(function(f){
      if(f.auto) return;
      headerMap[normalizeHeader(f.label.replace(/\s*\(₹\)/,""))] = f.key;
      (f.aliases||[]).forEach(function(a){ headerMap[normalizeHeader(a)] = f.key; });
    });

    var truckByNo = {};
    if(cfg.scope==="vehicle"){
      trucksForManager(managerName).forEach(function(t){ truckByNo[String(t.truckNo).toUpperCase().replace(/\s+/g,"")] = t.id; });
    }
    var driverNames = {};
    if(cfg.scope==="driver"){
      state.drivers.filter(function(d){return d.managerName===managerName;}).forEach(function(d){ driverNames[d.name.toUpperCase()] = d.name; });
    }

    var existingSigs = {};
    (state.expenses[type]||[]).forEach(function(e){ existingSigs[expenseSignature(type,e)] = true; });

    var added=0, skippedEmpty=0, skippedNoMatch=0, skippedDuplicate=0, unmatched={};
    for(var rowIdx2=0; rowIdx2<rows.length; rowIdx2++){
      if(rowIdx2>0 && rowIdx2%150===0){ state.expenseImportNote = "Importing… "+rowIdx2+" of "+rows.length+" rows"; render(); await yieldToBrowser(); }
      var row = rows[rowIdx2];
      var mapped = {}, vehicleRaw = "", driverRaw = "";
      Object.keys(row).forEach(function(rawKey){
        var norm = normalizeHeader(rawKey);
        if(norm==="VEHICLE" || norm==="TRUCK"){ vehicleRaw = row[rawKey]; return; }
        if(norm==="DRIVER" || norm==="DRIVER NAME"){ driverRaw = row[rawKey]; return; }
        var field = headerMap[norm];
        if(field) mapped[field] = row[rawKey];
      });
      var hasAnything = vehicleRaw || driverRaw || Object.keys(mapped).some(function(k){ return mapped[k]!==""; });
      if(!hasAnything){ skippedEmpty++; continue; }

      var entry = {};
      if(cfg.scope==="vehicle"){
        var vkey = String(vehicleRaw||"").toUpperCase().replace(/\s+/g,"");
        var tid = truckByNo[vkey];
        if(!tid){ skippedNoMatch++; if(vkey) unmatched[vehicleRaw]=true; continue; }
        entry.truckId = tid;
      } else {
        var dname = driverNames[String(driverRaw||"").toUpperCase()];
        if(!dname){ skippedNoMatch++; if(driverRaw) unmatched[driverRaw]=true; continue; }
        entry.driverName = dname;
      }

      cfg.fields.forEach(function(f){
        if(f.auto) return;
        var val = mapped[f.key];
        if(f.type==="date") entry[f.key] = excelDateToStr(val);
        else if(f.key==="fullTank"){
          var truthy = ["YES","Y","TRUE","1","FULL","FULLTANK"];
          entry[f.key] = truthy.indexOf(String(val||"").trim().toUpperCase())>-1 ? "Yes" : "No";
        }
        else entry[f.key] = val!=null ? String(val) : "";
      });

      var sig = expenseSignature(type, entry);
      if(existingSigs[sig]){ skippedDuplicate++; continue; }
      existingSigs[sig] = true;

      state.expenses[type].push(Object.assign({id:uid()}, entry, {createdAt:Date.now(), createdBy:state.session.name, updatedAt:Date.now(), updatedBy:state.session.name}));
      added++;
    }

    await retrySave(saveExpenses, "import expenses");

    var note = added+" entr"+(added===1?"y":"ies")+" imported for "+managerName+".";
    if(skippedDuplicate>0) note += " "+skippedDuplicate+" row(s) skipped as already in the register.";
    if(skippedNoMatch>0){
      var names = Object.keys(unmatched).slice(0,6).join(", ");
      note += " "+skippedNoMatch+" row(s) skipped — "+(cfg.scope==="vehicle"?"vehicle":"driver")+" not found in this manager's list ("+names+(Object.keys(unmatched).length>6?", …":"")+"). Add "+(cfg.scope==="vehicle"?"the vehicle":"the driver")+" first, then re-upload.";
    }
    state.expenseImportNote = note;
    state.expensePage = 1;
    render();
  }

  // Column config drives both the table header (with click-to-sort) and each
  // row's cells, so the two always stay in sync.
  var TRIP_COLUMNS = [
    {key:"date", label:"Date", get:function(tr){return tr.date||"";}},
    {key:"lr", label:"LR", get:function(tr){return tr.lr||"";}},
    {key:"challan", label:"Challan", get:function(tr){return tr.challan||"";}},
    {key:"truckNo", label:"Truck", get:function(tr){var t=findTruck(tr.truckId); return (t&&t.truckNo)||"";}},
    {key:"from", label:"From", get:function(tr){return tr.from||"";}},
    {key:"to", label:"To", get:function(tr){return tr.to||"";}},
    {key:"wt", label:"Wt", numeric:true, get:function(tr){return num(tr.wt);}},
    {key:"rate", label:"Rate", get:function(tr){return tr.rate||"";}},
    {key:"freight", label:"Freight", numeric:true, get:function(tr){return tripFreight(tr);}},
    {key:"driverAdv", label:"Driver Adv", numeric:true, get:function(tr){return num(tr.driverAdv);}},
    {key:"comm", label:"Comm", numeric:true, get:function(tr){return num(tr.comm);}},
    {key:"charges", label:"Charges", numeric:true, get:function(tr){return num(tr.charges);}},
    {key:"advCash", label:"Adv Cash", numeric:true, get:function(tr){return num(tr.advCash);}},
    {key:"advRec", label:"Adv Rec.", numeric:true, get:function(tr){return num(tr.advRec);}},
    {key:"advRecDate", label:"Adv Rec Date", get:function(tr){return tr.advRecDate||"";}},
    {key:"party", label:"Party", get:function(tr){return tr.party||"";}},
    {key:"tds", label:"TDS", numeric:true, get:function(tr){return num(tr.tds);}},
    {key:"bal", label:"Bal", numeric:true, get:function(tr){return tripBal(tr);}},
    {key:"balRec", label:"Bal Rec", numeric:true, get:function(tr){return num(tr.balRec);}},
    {key:"balRecDate", label:"Bal Rec Date", get:function(tr){return tr.balRecDate||"";}},
    {key:"balRemaining", label:"Bal Remaining", numeric:true, get:function(tr){return tripBalRemaining(tr);}},
    {key:"loadingKm", label:"Loading KM", numeric:true, get:function(tr){return num(tr.loadingKm);}},
    {key:"unloadingKm", label:"Unloading KM", numeric:true, get:function(tr){return num(tr.unloadingKm);}},
    {key:"totalDist", label:"Total Dist", numeric:true, get:function(tr){return tripTotalDist(tr);}},
    {key:"billNo", label:"Bill No", get:function(tr){return tr.billNo||"";}},
    {key:"billDate", label:"Bill Date", get:function(tr){return tr.billDate||"";}}
  ];
  var TRIP_FILTER_KEYS = ["lr","challan","truckNo","from","to","party","billNo"];

  function tripMatchesFilter(tr, q){
    if(!q) return true;
    q = q.toLowerCase();
    return TRIP_COLUMNS.some(function(c){
      if(TRIP_FILTER_KEYS.indexOf(c.key)===-1) return false;
      return String(c.get(tr)).toLowerCase().indexOf(q)>-1;
    });
  }

  function sortTrips(list){
    if(!state.dispatchSortKey) return list;
    var col = TRIP_COLUMNS.find(function(c){return c.key===state.dispatchSortKey;});
    if(!col) return list;
    var dir = state.dispatchSortDir;
    return list.slice().sort(function(a,b){
      var av = col.get(a), bv = col.get(b);
      if(col.numeric){ return (av-bv)*dir; }
      return String(av).localeCompare(String(bv))*dir;
    });
  }

  function renderTripTableBlock(list, opts){
    opts = opts || {};
    var shotId = opts.shotId || 'dispatch-table-shot';
    var sortable = !!opts.sortable;
    var selectable = !!opts.selectable;
    var allIds = opts.allIds || list.map(function(tr){ return tr.id; });
    var allChecked = selectable && allIds.length>0 && allIds.every(function(id){ return !!state.dispatchSelected[id]; });
    var isFullscreen = state.fullscreenTable===shotId;
    var html = "";
    if(isFullscreen){
      html += '<div class="mfl-fullscreen-bar"><span>Fleet Dispatch — full screen</span>'+
        '<button class="iconbtn" data-act="toggle-table-fullscreen" data-target="'+shotId+'">'+icon('collapse',14)+' Exit full screen</button></div>';
    }

  // ---------- Fleet Expenses: dashboard, table, form ----------
  function renderExpenseDashboard(){
    var type = state.activeExpenseType;
    var cfg = EXPENSE_TYPES[type];
    if(!cfg) return '<div class="empty">Unknown expense type.</div>';
    var role = state.session.role;
    var visibleManagers = role==="manager"
      ? state.managers.filter(function(m){ return m.name===state.session.name; })
      : state.managers.slice();

    if(!state.expenseManagerName || state.expenseManagerName==="__all__"){
      state.expenseManagerName = (role==="manager" ? state.session.name : (visibleManagers[0] && visibleManagers[0].name)) || null;
    }
    var selKey = state.expenseManagerName;
    var html = "";

    if(visibleManagers.length===0){
      return '<div class="empty">No fleet managers set up yet. Add a manager under Fleet Tracking → Managers first.</div>';
    }

    html += '<div class="card dispatch-mgr-bar">';
    html += '<div class="dispatch-mgr-title">'+esc(cfg.label)+' for</div>';
    html += '<div class="dispatch-mgr-row">';
    visibleManagers.forEach(function(m){
      html += '<div class="dispatch-mgr-pill'+(selKey===m.name?' active':'')+'" data-act="expense-select" data-name="'+esc(m.name)+'">'+icon('manager',15)+' '+esc(m.name)+'</div>';
    });
    html += '</div></div>';

    html += '<div class="dispatch-toolbar">';
    html += '<button class="btn btn-primary" style="width:auto;max-width:200px;" data-act="add-expense">'+icon('add',16)+' Add '+esc(cfg.label.split(" ")[0])+'</button>';
    html += '<div class="row" style="width:auto;">';
    html += '<button class="btn btn-ghost" style="width:auto;" data-act="trigger-expense-import">'+icon('upload',15)+' Upload your data</button>';
    if(expensesInScope(type, selKey).length>0){
      html += '<button class="btn btn-ghost" style="width:auto;" data-act="download-table-image" data-target="expense-table-shot">'+icon('download')+' Export JPG</button>';
      html += '<button class="btn btn-ghost" style="width:auto;" data-act="export-table-excel" data-target="expense-table-shot">'+icon('download')+' Export to Excel</button>';
    }
    html += '</div>';
    html += '</div>';
    html += '<input type="file" id="expense-import-file" accept=".xlsx,.xls" style="display:none">';
    if(state.expenseImportNote) html += '<div class="banner">'+esc(state.expenseImportNote)+'</div>';

    var fullList = expensesInScope(type, selKey);
    if(fullList.length>0){
      html += '<input class="search" id="expense-search" placeholder="Filter…" value="'+esc(state.expenseFilter)+'">';
    }
    html += renderLoadOlderControl('expenses');
    if(fullList.length>0) html += renderRangeExportControl('expenses');

    var list = fullList.filter(function(exp){
      if(!state.expenseFilter) return true;
      var q = state.expenseFilter.toLowerCase();
      return cfg.fields.some(function(f){ return String(expenseFieldValue(type,exp,f)).toLowerCase().indexOf(q)>-1; })
        || (cfg.scope==="vehicle" && (function(){ var t=findTruck(exp.truckId); return t && t.truckNo.toLowerCase().indexOf(q)>-1; })())
        || (cfg.scope==="driver" && String(exp.driverName||"").toLowerCase().indexOf(q)>-1);
    });

    if(state.expenseSortKey){
      var sortField = cfg.fields.find(function(f){return f.key===state.expenseSortKey;});
      var dir = state.expenseSortDir;
      list = list.slice().sort(function(a,b){
        var av = sortField ? (sortField.auto?expenseAmount(type,a):a[sortField.key]) : (a.createdAt||0);
        var bv = sortField ? (sortField.auto?expenseAmount(type,b):b[sortField.key]) : (b.createdAt||0);
        if(sortField && (sortField.type==="number" || sortField.auto)) return (num(av)-num(bv))*dir;
        return String(av||"").localeCompare(String(bv||""))*dir;
      });
    } else {
      list = list.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    }

    if(fullList.length===0){
      html += '<div class="empty">No '+esc(cfg.label.toLowerCase())+' entries yet for this manager. Click "Add '+esc(cfg.label.split(" ")[0])+'" to start.</div>';
    } else if(list.length===0){
      html += '<div class="empty">No entries match "'+esc(state.expenseFilter)+'".</div>';
    } else {
      var perPage = 50;
      var totalPages = Math.max(1, Math.ceil(list.length/perPage));
      if(state.expensePage>totalPages) state.expensePage = totalPages;
      if(state.expensePage<1) state.expensePage = 1;
      var startIdx = (state.expensePage-1)*perPage;
      var pageList = list.slice(startIdx, startIdx+perPage);
      state.expenseAllIds = list.map(function(x){ return x.id; });

      var selectedCount = Object.keys(state.expenseSelected).filter(function(id){ return state.expenseSelected[id]; }).length;
      if(selectedCount>0){
        html += '<div class="dispatch-bulkbar">'+
          '<span>'+selectedCount+' entr'+(selectedCount>1?'ies':'y')+' selected</span>'+
          '<button class="btn btn-danger" style="width:auto;" data-act="delete-selected-expenses">'+icon('trash',14)+' Delete selected</button>'+
          '<button class="btn btn-ghost" style="width:auto;" data-act="clear-expense-selection">Clear</button>'+
        '</div>';
      }

      html += renderExpenseTableBlock(type, pageList, {allIds:state.expenseAllIds});

      html += '<div class="dispatch-pagination">';
      html += '<div class="muted">Showing '+(startIdx+1)+' to '+Math.min(startIdx+perPage,list.length)+' of '+list.length+' entries</div>';
      html += '<div class="dp-pages">';
      html += '<button class="dp-page-btn" data-act="expense-page" data-page="'+(state.expensePage-1)+'"'+(state.expensePage<=1?' disabled':'')+'>«</button>';
      for(var p=1;p<=totalPages;p++){
        if(p===1 || p===totalPages || Math.abs(p-state.expensePage)<=1){
          html += '<button class="dp-page-btn'+(p===state.expensePage?' active':'')+'" data-act="expense-page" data-page="'+p+'">'+p+'</button>';
        } else if(Math.abs(p-state.expensePage)===2){
          html += '<span class="muted" style="padding:0 2px;">…</span>';
        }
      }
      html += '<button class="dp-page-btn" data-act="expense-page" data-page="'+(state.expensePage+1)+'"'+(state.expensePage>=totalPages?' disabled':'')+'>»</button>';
      html += '</div></div>';
    }
    return html;
  }

  // ---------- Business Dashboard ----------
  // Pulls together Dispatch (trips/revenue) and Expenses (fuel, service,
  // adblue, salary, challans) into one company-wide picture. Driver salary
  // is treated as a company-level cost, not allocated to a single vehicle
  // (a driver can move between trucks) — everything else that's logged
  // against a specific truckId counts as that vehicle's running cost.
  // ---------- lightweight inline SVG chart helpers (no external chart lib) ----------
  function monthKeysBack(n){
    var out = [], now = new Date();
    for(var i=n-1;i>=0;i--){
      var dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
      out.push(dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0"));
    }
    return out;
  }
  function monthLabel(mk){
    var names=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var p = mk.split("-");
    return names[parseInt(p[1],10)-1]+" "+p[0].slice(2);
  }
  // Month buckets spanning a from/to range (inclusive), capped to 12 so a
  // multi-year custom range still renders a sane chart.
  function monthKeysInRange(fromStr, toStr){
    var from = fromStr ? new Date(fromStr+"T00:00:00") : null;
    var to = toStr ? new Date(toStr+"T00:00:00") : null;
    if(!from || !to || isNaN(from) || isNaN(to) || from>to) return monthKeysBack(6);
    var out = [];
    var cur = new Date(from.getFullYear(), from.getMonth(), 1);
    var last = new Date(to.getFullYear(), to.getMonth(), 1);
    while(cur<=last && out.length<12){
      out.push(cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0"));
      cur.setMonth(cur.getMonth()+1);
    }
    return out.length ? out : monthKeysBack(6);
  }
  function svgLineChart(series, labels, opts){
    opts = opts||{};
    var w=opts.width||600, h=opts.height||170, pad=26;
    var allVals = series.reduce(function(a,s){return a.concat(s.values);},[0]);
    var maxV = Math.max.apply(null, allVals), minV = Math.min(0, Math.min.apply(null, allVals));
    var n = labels.length;
    function X(i){ return pad + i*(w-2*pad)/(Math.max(n-1,1)); }
    function Y(v){ return h-pad - (v-minV)/((maxV-minV)||1)*(h-2*pad); }
    var svg = '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block;">';
    for(var g=0; g<=3; g++){
      var gy = pad + g*(h-2*pad)/3;
      svg += '<line x1="'+pad+'" y1="'+gy+'" x2="'+(w-pad)+'" y2="'+gy+'" stroke="#1c2740" stroke-width="1"/>';
    }
    series.forEach(function(s){
      var pts = s.values.map(function(v,i){ return X(i)+","+Y(v); }).join(" ");
      svg += '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2.4" style="filter:drop-shadow(0 0 3px '+s.color+');"/>';
      s.values.forEach(function(v,i){ svg += '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="2.6" fill="'+s.color+'"/>'; });
    });
    labels.forEach(function(lab,i){
      svg += '<text x="'+X(i)+'" y="'+(h-6)+'" font-size="8.5" fill="#8fa3c9" text-anchor="middle">'+esc(lab)+'</text>';
    });
    svg += '</svg>';
    return svg;
  }
  function svgDonut(segments, opts){
    opts = opts||{};
    var size=opts.size||132, stroke=opts.stroke||20;
    var r=(size-stroke)/2, cx=size/2, cy=size/2;
    var total = segments.reduce(function(s,x){return s+x.value;},0) || 1;
    var circ = 2*Math.PI*r, offset=0;
    var svg = '<svg viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px;flex-shrink:0;">';
    segments.forEach(function(seg){
      if(seg.value<=0) return;
      var dash = seg.value/total*circ;
      svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="'+stroke+'" '+
        'stroke-dasharray="'+dash+' '+(circ-dash)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')" style="filter:drop-shadow(0 0 3px '+seg.color+');"/>';
      offset += dash;
    });
    svg += '<text x="'+cx+'" y="'+(cy-3)+'" font-size="13" font-weight="800" fill="#f1f5ff" text-anchor="middle">₹'+shortMoney(total)+'</text>';
    svg += '<text x="'+cx+'" y="'+(cy+13)+'" font-size="8" fill="#8fa3c9" text-anchor="middle">Total</text>';
    svg += '</svg>';
    return svg;
  }
  function shortMoney(n){
    n = Math.abs(n);
    if(n>=10000000) return (n/10000000).toFixed(2)+'Cr';
    if(n>=100000) return (n/100000).toFixed(2)+'L';
    if(n>=1000) return (n/1000).toFixed(1)+'k';
    return money(n);
  }

  function computeBusinessStats(filters){
    filters = filters || {};
    var dateFrom = filters.dateFrom || "";
    var dateTo = filters.dateTo || "";
    var trips = state.trips.filter(function(tr){ return inDateRange(tr.date, dateFrom, dateTo); });
    var exp = {};
    ["fuel","service","adblue","challan","salary"].forEach(function(type){
      exp[type] = (state.expenses[type]||[]).filter(function(e){ return inDateRange(e.date, dateFrom, dateTo); });
    });
    var rtgsList = state.rtgsEntries.filter(function(r){ return inDateRange(r.date, dateFrom, dateTo); });
    var branchExpList = state.branchExpenses.filter(function(r){ return inDateRange(r.date, dateFrom, dateTo); });
    var vehicleRevenue = {}, vehicleTripCount = {}, vehicleCost = {};

    trips.forEach(function(tr){
      vehicleRevenue[tr.truckId] = (vehicleRevenue[tr.truckId]||0) + tripFreight(tr);
      vehicleTripCount[tr.truckId] = (vehicleTripCount[tr.truckId]||0) + 1;
    });
    ["fuel","service","adblue","challan"].forEach(function(type){
      (exp[type]||[]).forEach(function(e){
        if(!e.truckId) return;
        vehicleCost[e.truckId] = (vehicleCost[e.truckId]||0) + expenseAmount(type, e);
      });
    });
    var vehicleProfit = {};
    state.trucks.forEach(function(t){ vehicleProfit[t.id] = (vehicleRevenue[t.id]||0) - (vehicleCost[t.id]||0); });

    var routeProfit = {}, routeRevenue = {}, routeCount = {};
    trips.forEach(function(tr){
      var route = (tr.from||"?")+" → "+(tr.to||"?");
      var net = tripFreight(tr) - num(tr.comm) - num(tr.charges) - num(tr.tds);
      routeProfit[route] = (routeProfit[route]||0) + net;
      routeRevenue[route] = (routeRevenue[route]||0) + tripFreight(tr);
      routeCount[route] = (routeCount[route]||0) + 1;
    });

    var mileageSum = {}, mileageCount = {};
    (exp.fuel||[]).forEach(function(e){
      var m = fuelMileage(e);
      if(m!=null && isFinite(m) && m>0){
        mileageSum[e.truckId] = (mileageSum[e.truckId]||0) + m;
        mileageCount[e.truckId] = (mileageCount[e.truckId]||0) + 1;
      }
    });
    var vehicleAvgMileage = {};
    Object.keys(mileageSum).forEach(function(id){ vehicleAvgMileage[id] = mileageSum[id]/mileageCount[id]; });

    var managerSalaryCost = {};
    (exp.salary||[]).forEach(function(e){
      var drv = state.drivers.find(function(d){return d.name===e.driverName;});
      if(!drv || !drv.managerName) return;
      var sign = e.type==="Deduction" ? -1 : 1;
      managerSalaryCost[drv.managerName] = (managerSalaryCost[drv.managerName]||0) + sign*num(e.amount);
    });
    var managerStats = state.managers.map(function(m){
      var ids = m.vehicleIds||[];
      var rev=0, cost=0;
      ids.forEach(function(id){ rev += vehicleRevenue[id]||0; cost += vehicleCost[id]||0; });
      cost += managerSalaryCost[m.name]||0;
      var profit = rev-cost;
      return {name:m.name, revenue:rev, cost:cost, profit:profit, margin: rev>0 ? (profit/rev*100) : null};
    });

    var partyProfit = {};
    trips.forEach(function(tr){
      var p = tr.party || "Unknown";
      var net = tripFreight(tr) - num(tr.comm) - num(tr.charges) - num(tr.tds);
      partyProfit[p] = (partyProfit[p]||0) + net;
    });

    var totalRevenue = trips.reduce(function(s,tr){return s+tripFreight(tr);},0);
    // The Daily Dispatch & RTGS side (branches) earns a brokerage margin
    // rather than a freight revenue/cost pair, so it's folded into the
    // combined EWR-wide totals as its own revenue/cost pair here.
    var rtgsTotalMargin = rtgsList.reduce(function(s,r){return s+rtgsMargin(r);},0);
    var rtgsTotalBookingSum = rtgsList.reduce(function(s,r){return s+rtgsTotalBooking(r);},0);
    var rtgsTotalLorrySum = rtgsList.reduce(function(s,r){return s+rtgsTotalLorry(r);},0);
    var totalBranchExpense = branchExpList.reduce(function(s,r){return s+num(r.amount);},0);
    var totalFuelCost = (exp.fuel||[]).reduce(function(s,e){return s+expenseAmount("fuel",e);},0);
    var totalServiceCost = (exp.service||[]).reduce(function(s,e){return s+num(e.amount);},0);
    var totalAdblueCost = (exp.adblue||[]).reduce(function(s,e){return s+expenseAmount("adblue",e);},0);
    var totalChallanCost = (exp.challan||[]).reduce(function(s,e){return s+num(e.amount);},0);
    var totalSalaryCost = (exp.salary||[]).reduce(function(s,e){ var sign=e.type==="Deduction"?-1:1; return s+sign*num(e.amount); },0);
    var totalExpenses = totalFuelCost+totalServiceCost+totalAdblueCost+totalChallanCost+totalSalaryCost;
    var pendingChallans = (exp.challan||[]).filter(function(e){return e.status==="Pending";});

    // Last 6 months of revenue/expense/profit, for the trend charts.
    var months = monthKeysBack(6);
    var monthRevenue = {}, monthExpense = {};
    months.forEach(function(mk){ monthRevenue[mk]=0; monthExpense[mk]=0; });
    trips.forEach(function(tr){
      var mk = tr.date ? tr.date.slice(0,7) : null;
      if(mk && monthRevenue.hasOwnProperty(mk)) monthRevenue[mk] += tripFreight(tr);
    });
    ["fuel","service","adblue","challan"].forEach(function(type){
      (exp[type]||[]).forEach(function(e){
        var mk = e.date ? e.date.slice(0,7) : null;
        if(mk && monthExpense.hasOwnProperty(mk)) monthExpense[mk] += expenseAmount(type, e);
      });
    });
    (exp.salary||[]).forEach(function(e){
      var mk = e.date ? e.date.slice(0,7) : null;
      if(mk && monthExpense.hasOwnProperty(mk)){ var sign=e.type==="Deduction"?-1:1; monthExpense[mk]+=sign*num(e.amount); }
    });

    // Real alerts — every line here comes from actual data, nothing invented.
    var alerts = [];
    pendingChallans.forEach(function(e){
      var truck = findTruck(e.truckId);
      alerts.push({type:"challan", text:(truck?truck.truckNo:"Unknown vehicle")+" — pending challan ₹"+money(num(e.amount))+(e.violation?" ("+e.violation+")":""), when:e.date});
    });
    state.trucks.forEach(function(t){
      var p = vehicleProfit[t.id];
      if(p!=null && p<0) alerts.push({type:"loss", text:t.truckNo+" is running at a loss (₹"+money(Math.abs(p))+")", when:null});
    });
    alerts.sort(function(a,b){ return (b.when||"").localeCompare(a.when||""); });

    function topBy(map, wantMax){
      var bestId=null, bestVal=null;
      Object.keys(map).forEach(function(id){
        var v = map[id];
        if(bestVal===null || (wantMax ? v>bestVal : v<bestVal)){ bestVal=v; bestId=id; }
      });
      return bestId===null ? null : {key:bestId, val:bestVal};
    }

    return {
      vehicleRevenue:vehicleRevenue, vehicleCost:vehicleCost, vehicleProfit:vehicleProfit,
      vehicleTripCount:vehicleTripCount, vehicleAvgMileage:vehicleAvgMileage,
      routeProfit:routeProfit, routeRevenue:routeRevenue, routeCount:routeCount,
      managerStats:managerStats, partyProfit:partyProfit,
      totalRevenue:totalRevenue, totalFuelCost:totalFuelCost, totalServiceCost:totalServiceCost,
      totalAdblueCost:totalAdblueCost, totalChallanCost:totalChallanCost, totalSalaryCost:totalSalaryCost,
      totalExpenses:totalExpenses, netProfit:(totalRevenue-totalExpenses)+rtgsTotalMargin-totalBranchExpense,
      rtgsTotalMargin:rtgsTotalMargin, rtgsTotalBookingSum:rtgsTotalBookingSum, rtgsTotalLorrySum:rtgsTotalLorrySum,
      totalBranchExpense: totalBranchExpense,
      combinedRevenue: totalRevenue + rtgsTotalBookingSum,
      combinedExpense: totalExpenses + rtgsTotalLorrySum + totalBranchExpense,
      combinedProfit: (totalRevenue + rtgsTotalBookingSum) - (totalExpenses + rtgsTotalLorrySum + totalBranchExpense),
      outstandingBalance: trips.reduce(function(s,tr){return s+tripBalRemaining(tr);},0),
      pendingChallanCount: pendingChallans.length,
      pendingChallanAmount: pendingChallans.reduce(function(s,e){return s+num(e.amount);},0),
      mostProfitableVehicle: topBy(vehicleProfit, true),
      mostLossVehicle: topBy(vehicleProfit, false),
      mostMileageVehicle: topBy(vehicleAvgMileage, true),
      mostTripsVehicle: topBy(vehicleTripCount, true),
      mostProfitableRoute: topBy(routeProfit, true),
      mostLossRoute: topBy(routeProfit, false),
      totalTrips: trips.length,
      totalVehicles: state.trucks.length,
      months: months, monthRevenue: monthRevenue, monthExpense: monthExpense,
      alerts: alerts
    };
  }

  // ---------- Own Fleet Dashboard ----------
  // Resolves the active Own Fleet filters (company / manager / date range)
  // into a concrete {from, to} date string pair. "custom" uses the stored
  // dateFrom/dateTo directly; the named presets are computed fresh so they
  // always mean "today" relative to when the dashboard is viewed.
  function resolveOwnFleetRange(filters){
    if(filters.preset==="custom") return {from:filters.dateFrom||"", to:filters.dateTo||""};
    if(filters.preset==="all") return {from:"", to:""};
    return dateRangeFromPreset(filters.preset);
  }
  function inDateRange(dateStr, from, to){
    if(!dateStr) return !from && !to; // undated records only show up when no date filter is active
    if(from && dateStr<from) return false;
    if(to && dateStr>to) return false;
    return true;
  }
  // Native date inputs can fire a "change" event with a technically-parseable
  // but nonsensical value (e.g. a 1- or 2-digit year typed so far, like
  // "0002-03-01") the moment the field loses focus mid-entry — before this,
  // a bad year like that would silently become the filter and quietly zero
  // out an entire dashboard. Anything outside a sane operating-year range is
  // rejected here and the filter just keeps its last good value.
  function isValidFilterDate(v){
    if(!v) return true;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    if(!m) return false;
    var year = Number(m[1]);
    if(year < 2015 || year > 2035) return false;
    var d = new Date(v+"T00:00:00");
    return !isNaN(d.getTime());
  }

  // Scoped, filterable counterpart to computeBusinessStats — restricted to
  // Own Fleet data (trips + vehicle expenses; the Daily Dispatch/RTGS branch
  // side is out of scope here) and to whichever company/manager/date-range
  // combination is currently selected on the Own Fleet Dashboard.
  function computeOwnFleetStats(filters){
    var range = resolveOwnFleetRange(filters);
    var scopedTrucks = state.trucks.filter(function(t){
      var okCompany = filters.company==="all" || (t.companyId||"")===filters.company;
      var okManager = filters.manager==="all" || managerOfTruck(t.id)===filters.manager;
      return okCompany && okManager;
    });
    var scopedIds = {}; scopedTrucks.forEach(function(t){ scopedIds[t.id]=true; });

    var trips = state.trips.filter(function(tr){ return scopedIds[tr.truckId] && inDateRange(tr.date, range.from, range.to); });
    var exp = state.expenses;
    function scopedExp(type){
      return (exp[type]||[]).filter(function(e){ return scopedIds[e.truckId] && inDateRange(e.date, range.from, range.to); });
    }
    var fuelList = scopedExp("fuel"), serviceList = scopedExp("service"), adblueList = scopedExp("adblue"), challanList = scopedExp("challan");

    // Salary isn't logged per-vehicle (a driver can move between trucks), so
    // it can only be scoped by manager, not by company. When "All companies"
    // is selected this still counts in full; when a specific company is
    // selected, salary cost is left out of that company's total rather than
    // guessed at, since the data doesn't record which company a driver's
    // time belongs to.
    var salaryList = [];
    if(filters.company==="all"){
      salaryList = (exp.salary||[]).filter(function(e){
        var drv = state.drivers.find(function(d){return d.name===e.driverName;});
        var okManager = filters.manager==="all" || (drv && drv.managerName===filters.manager);
        return okManager && inDateRange(e.date, range.from, range.to);
      });
    }

    var vehicleRevenue={}, vehicleTripCount={}, vehicleCost={}, vehicleDist={};
    var routeRevenue={}, routeCount={}, partyRevenue={};
    trips.forEach(function(tr){
      vehicleRevenue[tr.truckId] = (vehicleRevenue[tr.truckId]||0) + tripFreight(tr);
      vehicleTripCount[tr.truckId] = (vehicleTripCount[tr.truckId]||0) + 1;
      var dist = tripTotalDist(tr);
      if(dist!=="" && isFinite(dist)) vehicleDist[tr.truckId] = (vehicleDist[tr.truckId]||0) + num(dist);
      var routeKey = (tr.from||"?")+" → "+(tr.to||"?");
      routeRevenue[routeKey] = (routeRevenue[routeKey]||0) + tripFreight(tr);
      routeCount[routeKey] = (routeCount[routeKey]||0) + 1;
      var partyKey = tr.party || "Unknown";
      partyRevenue[partyKey] = (partyRevenue[partyKey]||0) + tripFreight(tr);
    });
    // Driver advance is cash the driver draws down and spends on the road
    // (fuel top-ups, tolls, local repairs) — it's a real cost of running the
    // trip, so it's folded into vehicle cost and the fleet-wide expense total
    // exactly like fuel or a challan, not treated as a separate receivable.
    var totalDriverAdvance = trips.reduce(function(s,tr){return s+num(tr.driverAdv);},0);
    trips.forEach(function(tr){
      var adv = num(tr.driverAdv);
      if(adv) vehicleCost[tr.truckId] = (vehicleCost[tr.truckId]||0) + adv;
    });
    [["fuel",fuelList],["service",serviceList],["adblue",adblueList],["challan",challanList]].forEach(function(pair){
      pair[1].forEach(function(e){ vehicleCost[e.truckId] = (vehicleCost[e.truckId]||0) + expenseAmount(pair[0], e); });
    });
    var vehicleProfit = {};
    scopedTrucks.forEach(function(t){ vehicleProfit[t.id] = (vehicleRevenue[t.id]||0) - (vehicleCost[t.id]||0); });

    var mileageSum={}, mileageCount={};
    fuelList.forEach(function(e){
      var m = fuelMileage(e);
      if(m!=null && isFinite(m) && m>0){ mileageSum[e.truckId]=(mileageSum[e.truckId]||0)+m; mileageCount[e.truckId]=(mileageCount[e.truckId]||0)+1; }
    });
    var vehicleAvgMileage = {};
    Object.keys(mileageSum).forEach(function(id){ vehicleAvgMileage[id] = mileageSum[id]/mileageCount[id]; });

    var idleVehicles = scopedTrucks.filter(function(t){ return !vehicleTripCount[t.id]; });

    var emptyStats = computeEmptyLegStats(trips);

    var totalRevenue = trips.reduce(function(s,tr){return s+tripFreight(tr);},0);
    var totalFuelCost = fuelList.reduce(function(s,e){return s+expenseAmount("fuel",e);},0);
    var totalServiceCost = serviceList.reduce(function(s,e){return s+num(e.amount);},0);
    var totalAdblueCost = adblueList.reduce(function(s,e){return s+expenseAmount("adblue",e);},0);
    var totalChallanCost = challanList.reduce(function(s,e){return s+num(e.amount);},0);
    var totalSalaryCost = salaryList.reduce(function(s,e){ var sign=e.type==="Deduction"?-1:1; return s+sign*num(e.amount); },0);
    var totalExpenses = totalFuelCost+totalServiceCost+totalAdblueCost+totalChallanCost+totalSalaryCost+totalDriverAdvance;
    var pendingChallans = challanList.filter(function(e){return e.status==="Pending";});
    var outstandingBalance = trips.reduce(function(s,tr){return s+tripBalRemaining(tr);},0);

    function topBy(map, wantMax, minCount){
      var bestId=null, bestVal=null;
      Object.keys(map).forEach(function(id){
        var v = map[id];
        if(minCount!=null && v.count<minCount) return;
        var cmp = (v && typeof v==="object") ? v.total : v;
        if(bestVal===null || (wantMax ? cmp>bestVal : cmp<bestVal)){ bestVal=cmp; bestId=id; }
      });
      return bestId===null ? null : {key:bestId, val:bestVal, raw:map[bestId]};
    }

    var months = monthKeysInRange(range.from, range.to);
    var monthRevenue={}, monthExpense={};
    months.forEach(function(mk){ monthRevenue[mk]=0; monthExpense[mk]=0; });
    trips.forEach(function(tr){
      var mk = tr.date ? tr.date.slice(0,7) : null;
      if(mk && monthRevenue.hasOwnProperty(mk)) monthRevenue[mk] += tripFreight(tr);
    });
    [["fuel",fuelList],["service",serviceList],["adblue",adblueList],["challan",challanList]].forEach(function(pair){
      pair[1].forEach(function(e){
        var mk = e.date ? e.date.slice(0,7) : null;
        if(mk && monthExpense.hasOwnProperty(mk)) monthExpense[mk] += expenseAmount(pair[0], e);
      });
    });
    salaryList.forEach(function(e){
      var mk = e.date ? e.date.slice(0,7) : null;
      if(mk && monthExpense.hasOwnProperty(mk)){ var sign=e.type==="Deduction"?-1:1; monthExpense[mk]+=sign*num(e.amount); }
    });

    // Manager-wise breakdown, scoped to whichever companies/managers are in
    // scope (so "Company = X" shows only managers who actually have X
    // vehicles, with figures limited to those vehicles).
    var managerNamesInScope = {};
    scopedTrucks.forEach(function(t){ var mn = managerOfTruck(t.id); if(mn) managerNamesInScope[mn]=true; });
    var managerStats = Object.keys(managerNamesInScope).map(function(name){
      var mgr = state.managers.find(function(m){return m.name===name;});
      var ids = (mgr&&mgr.vehicleIds||[]).filter(function(id){return scopedIds[id];});
      var rev=0, cost=0;
      ids.forEach(function(id){ rev += vehicleRevenue[id]||0; cost += vehicleCost[id]||0; });
      var profit = rev-cost;
      return {name:name, revenue:rev, cost:cost, profit:profit, margin: rev>0 ? (profit/rev*100) : null};
    });

    return {
      scopedTrucks: scopedTrucks, range: range,
      vehicleRevenue:vehicleRevenue, vehicleCost:vehicleCost, vehicleProfit:vehicleProfit,
      vehicleTripCount:vehicleTripCount, vehicleAvgMileage:vehicleAvgMileage, vehicleDist:vehicleDist,
      routeRevenue:routeRevenue, routeCount:routeCount, partyRevenue:partyRevenue,
      idleVehicles:idleVehicles, emptyStats:emptyStats,
      totalRevenue:totalRevenue, totalFuelCost:totalFuelCost, totalServiceCost:totalServiceCost,
      totalAdblueCost:totalAdblueCost, totalChallanCost:totalChallanCost, totalSalaryCost:totalSalaryCost,
      totalDriverAdvance:totalDriverAdvance,
      totalExpenses:totalExpenses, netProfit: totalRevenue-totalExpenses,
      outstandingBalance:outstandingBalance,
      pendingChallanCount: pendingChallans.length,
      pendingChallanAmount: pendingChallans.reduce(function(s,e){return s+num(e.amount);},0),
      totalTrips: trips.length,
      totalVehicles: scopedTrucks.length,
      months: months, monthRevenue: monthRevenue, monthExpense: monthExpense,
      managerStats: managerStats,
      mostProfitableVehicle: topBy(vehicleProfit, true),
      mostLossVehicle: topBy(vehicleProfit, false),
      mostMileageVehicle: topBy(vehicleAvgMileage, true),
      mostTripsVehicle: topBy(vehicleTripCount, true),
      mostDistanceVehicle: topBy(vehicleDist, true),
      mostEarningRoute: topBy(routeRevenue, true),
      leastEarningRoute: topBy(routeRevenue, false),
      topEmptyRoute: topBy(emptyStats.routeEmpty, true, 1)
    };
  }

  function bizSectionHead(title, detailKey, act){
    return '<div class="biz-section-title" style="display:flex;justify-content:space-between;align-items:center;">'+
      '<span>'+esc(title)+'</span>'+
      (detailKey ? '<span class="biz-viewall" data-act="'+(act||'biz-view-all')+'" data-key="'+detailKey+'">View All ›</span>' : '')+
    '</div>';
  }

  function bizMiniCard(title, detailKey, bodyHtml, neon){
    return '<div class="biz-mini-card" style="--neon:'+(neon||'#00e5ff')+';">'+
      '<div class="biz-mini-head"><span class="biz-mini-title">'+esc(title)+'</span>'+
      (detailKey ? '<span class="biz-viewall" data-act="ofl-view-all" data-key="'+detailKey+'">View All ›</span>' : '')+
      '</div>'+bodyHtml+'</div>';
  }
  function bizMiniRankRows(items){
    if(!items.length) return '<div class="biz-empty" style="padding:2px 0;">No data yet.</div>';
    return items.map(function(it,i){
      return '<div class="biz-mini-rank-row"><span><span class="biz-mini-rank-badge">'+(i+1)+'</span>'+esc(it.name)+'</span>'+
        '<span style="color:'+(it.color||'#7CFF6B')+';font-weight:700;">'+it.valText+'</span></div>';
    }).join('');
  }
  function bizMiniBarRows(items, maxVal){
    if(!items.length) return '<div class="biz-empty" style="padding:2px 0;">No data yet.</div>';
    return items.map(function(it){
      var pct = maxVal>0 ? Math.max(3,Math.min(100, it.val/maxVal*100)) : 0;
      return '<div class="biz-mini-bar-row"><div class="biz-mini-bar-label">'+esc(it.name)+'</div>'+
        '<div class="biz-mini-bar-track"><div class="biz-mini-bar-fill" style="width:'+pct+'%;"></div></div>'+
        '<div class="biz-mini-bar-val">'+it.valText+'</div></div>';
    }).join('');
  }
  function bizMiniHero(valText, subText){
    return '<div class="biz-mini-hero">'+valText+'</div>'+(subText?'<div class="biz-mini-hero-sub">'+esc(subText)+'</div>':'');
  }

  function renderBizDetail(){
    var key = state.bizDetailKey;
    var s = computeBusinessStats();
    var html = '<div class="backlink" data-act="back">‹ Back</div>';
    var rows = [], cols = [];

    if(key==="vehicleProfit"){
      cols = ['Vehicle','Trips','Revenue','Expenses','Profit','Profit %','Avg mileage'];
      rows = state.trucks.map(function(t){
        var rev=s.vehicleRevenue[t.id]||0, cost=s.vehicleCost[t.id]||0, profit=s.vehicleProfit[t.id]||0, trips=s.vehicleTripCount[t.id]||0;
        var pct = rev>0 ? (profit/rev*100).toFixed(1)+'%' : '—';
        var mil = s.vehicleAvgMileage[t.id]!=null ? s.vehicleAvgMileage[t.id].toFixed(2)+' km/l' : '—';
        return {sortVal:profit, cells:[t.truckNo, trips, '₹'+money(rev), '₹'+money(cost), (profit<0?'−':'')+'₹'+money(Math.abs(profit)), pct, mil]};
      }).sort(function(a,b){return b.sortVal-a.sortVal;});
    } else if(key==="route"){
      cols = ['Route','Trips','Revenue','Net profit'];
      rows = Object.keys(s.routeProfit).map(function(r){
        return {sortVal:s.routeProfit[r], cells:[r, s.routeCount[r], '₹'+money(s.routeRevenue[r]), (s.routeProfit[r]<0?'−':'')+'₹'+money(Math.abs(s.routeProfit[r]))]};
      }).sort(function(a,b){return b.sortVal-a.sortVal;});
    } else if(key==="manager"){
      cols = ['Manager','Revenue','Cost','Profit','Margin %'];
      rows = s.managerStats.map(function(m){
        return {sortVal:m.margin==null?-Infinity:m.margin, cells:[m.name, '₹'+money(m.revenue), '₹'+money(m.cost), (m.profit<0?'−':'')+'₹'+money(Math.abs(m.profit)), m.margin==null?'—':m.margin.toFixed(1)+'%']};
      }).sort(function(a,b){return b.sortVal-a.sortVal;});
    } else if(key==="party"){
      cols = ['Party','Net profit'];
      rows = Object.keys(s.partyProfit).map(function(p){
        return {sortVal:s.partyProfit[p], cells:[p, (s.partyProfit[p]<0?'−':'')+'₹'+money(Math.abs(s.partyProfit[p]))]};
      }).sort(function(a,b){return b.sortVal-a.sortVal;});
    }

    html += '<h2 style="margin-bottom:10px;">'+({vehicleProfit:'All vehicles',route:'All routes',manager:'All fleet managers',party:'All parties'}[key]||'Details')+'</h2>';
    if(rows.length===0){
      html += '<div class="empty">No data yet.</div>';
    } else {
      html += '<div class="mfl-table-wrap"><table class="mfl-table"><thead><tr>';
      cols.forEach(function(c){ html += '<th>'+esc(c)+'</th>'; });
      html += '</tr></thead><tbody>';
      rows.forEach(function(r){
        html += '<tr>'+r.cells.map(function(c){ return '<td>'+esc(String(c))+'</td>'; }).join('')+'</tr>';
      });
      html += '</tbody></table></div>';
    }
    return html;
  }

    html += bizKpi('Total Expenses', '₹'+money(s.totalExpenses), 'Incl. driver advance', '#ff5c7a');
    html += bizKpi('Net Profit', (s.netProfit<0?'−':'')+'₹'+money(Math.abs(s.netProfit)), 'Revenue − Expenses', s.netProfit>=0?'#7CFF6B':'#ff5c7a');
    html += bizKpi('Profit Margin', s.totalRevenue>0 ? (s.netProfit/s.totalRevenue*100).toFixed(1)+'%' : '—', null, '#b98bff');
    html += bizKpi('Total Trips', s.totalTrips, null, '#4fc3ff');
    html += bizKpi('Total Vehicles', s.totalVehicles, null, '#ffa733');
    html += bizKpi('Outstanding', '₹'+money(s.outstandingBalance), 'Owed by parties', '#ffd166');
    html += bizKpi('Pending Challans', s.pendingChallanCount, '₹'+money(s.pendingChallanAmount)+' unpaid', '#ff2e88');
    html += bizKpi('Empty Running', money(Math.round(s.emptyStats.totalEmptyKm))+' km', 'Between drop & next pickup', '#8fa3c9');
    html += '</div>';

    // ---- Charts row: Expense breakup + Profit trend, side by side ----
    html += '<div class="biz-charts-row">';

    html += '<div>';
    html += bizSectionHead('Expenses breakup', null);
    html += '<div class="card" style="background:#0d1326;border-color:#1c2740;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">';
    if(s.totalExpenses<=0){
      html += '<div class="biz-empty">No expenses logged in this range yet.</div>';
    } else {
      var expenseRows = [
        ['Fuel', s.totalFuelCost, '#00e5ff'],
        ['Salaries', s.totalSalaryCost, '#ffd166'],
        ['Service/Maint.', s.totalServiceCost, '#ffa733'],
        ['Driver Adv.', s.totalDriverAdvance, '#b98bff'],
        ['Toll/Challan', s.totalChallanCost, '#ff2e88'],
        ['Adblue', s.totalAdblueCost, '#4fc3ff']
      ];
      html += svgDonut(expenseRows.map(function(r){return {label:r[0], value:r[1], color:r[2]};}), {size:108, stroke:16});
      html += '<div style="flex:1;min-width:130px;font-size:11px;">';
      expenseRows.forEach(function(row){
        var pct = s.totalExpenses>0 ? (row[1]/s.totalExpenses*100).toFixed(1) : '0.0';
        html += '<div style="display:flex;justify-content:space-between;padding:2px 0;">'+
          '<span style="color:'+row[2]+';">● '+row[0]+'</span><span style="color:#e3e9f7;">₹'+money(row[1])+' ('+pct+'%)</span></div>';
      });
      html += '</div>';
    }
    html += '</div></div>';

    html += '<div>';
    html += bizSectionHead('Profit trend', null);
    html += '<div class="card" style="background:#0d1326;border-color:#1c2740;">';
    if(s.totalTrips===0 && s.totalExpenses===0){
      html += '<div class="biz-empty">No trips or expenses in this range yet.</div>';
    } else {
      var lineLabels = s.months.map(monthLabel);
      var revVals = s.months.map(function(mk){return s.monthRevenue[mk];});
      var expVals = s.months.map(function(mk){return s.monthExpense[mk];});
      var profVals = s.months.map(function(mk){return s.monthRevenue[mk]-s.monthExpense[mk];});
      html += svgLineChart([
        {label:'Revenue', color:'#7CFF6B', values:revVals},
        {label:'Expenses', color:'#ff5c7a', values:expVals},
        {label:'Profit', color:'#ffd166', values:profVals}
      ], lineLabels);
      html += '<div style="display:flex;gap:10px;margin-top:6px;font-size:10.5px;">'+
        '<span style="color:#7CFF6B;">● Revenue</span><span style="color:#ff5c7a;">● Expenses</span><span style="color:#ffd166;">● Profit</span></div>';
    }
    html += '</div></div>';

    html += '</div>'; // .biz-charts-row

    // ---- Prep ranked data used by the mini-cards below ----
    var vehRowsAll = s.scopedTrucks.map(function(t){
      return {name:t.truckNo, profit:s.vehicleProfit[t.id]||0, trips:s.vehicleTripCount[t.id]||0,
        dist:s.vehicleDist[t.id]||0, mileage:s.vehicleAvgMileage[t.id]};
    });
    var topProfitVeh = vehRowsAll.filter(function(r){return r.profit>0;}).sort(function(a,b){return b.profit-a.profit;}).slice(0,3)
      .map(function(r){return {name:r.name, valText:'₹'+money(r.profit), color:'#7CFF6B'};});
    var topLossVeh = vehRowsAll.filter(function(r){return r.profit<0;}).sort(function(a,b){return a.profit-b.profit;}).slice(0,3)
      .map(function(r){return {name:r.name, valText:'−₹'+money(Math.abs(r.profit)), color:'#ff5c7a'};});
    var topMileageVeh = vehRowsAll.filter(function(r){return r.mileage!=null && isFinite(r.mileage);}).sort(function(a,b){return b.mileage-a.mileage;}).slice(0,3)
      .map(function(r){return {name:r.name, valText:r.mileage.toFixed(2)+' km/l', color:'#4fc3ff'};});
    var topTripsVeh = vehRowsAll.filter(function(r){return r.trips>0;}).sort(function(a,b){return b.trips-a.trips;}).slice(0,3)
      .map(function(r){return {name:r.name, valText:r.trips+' trip'+(r.trips>1?'s':''), color:'#ffd166'};});
    var topDistVeh = vehRowsAll.filter(function(r){return r.dist>0;}).sort(function(a,b){return b.dist-a.dist;}).slice(0,3)
      .map(function(r){return {name:r.name, valText:money(Math.round(r.dist))+' km', color:'#00e5ff'};});

    var routeRowsAll = Object.keys(s.routeRevenue).map(function(k){return {name:k, val:s.routeRevenue[k]};});
    var topEarnRoute = routeRowsAll.slice().sort(function(a,b){return b.val-a.val;}).slice(0,3)
      .map(function(r){return {name:r.name, valText:'₹'+money(r.val), color:'#7CFF6B'};});
    var lowEarnRoute = routeRowsAll.slice().sort(function(a,b){return a.val-b.val;}).slice(0,3)
      .map(function(r){return {name:r.name, valText:'₹'+money(r.val), color:'#ff5c7a'};});
    var emptyRouteRows = Object.keys(s.emptyStats.routeEmpty).map(function(k){
      var v = s.emptyStats.routeEmpty[k]; return {name:k, val:v.total, count:v.count};
    }).sort(function(a,b){return b.val-a.val;}).slice(0,3)
      .map(function(r){return {name:r.name, valText:money(Math.round(r.val))+' km ('+r.count+'x)', color:'#ffa733'};});

    var mgrSorted = s.managerStats.filter(function(m){return m.revenue>0;}).sort(function(a,b){return b.margin-a.margin;});
    var topMgrRows = mgrSorted.slice(0,3).map(function(m){return {name:m.name, valText:m.margin.toFixed(1)+'%', color:m.margin>=0?'#7CFF6B':'#ff5c7a'};});

    var partyList = Object.keys(s.partyRevenue).map(function(p){return {name:p, val:s.partyRevenue[p]};}).sort(function(a,b){return b.val-a.val;});
    var maxParty = partyList.length ? partyList[0].val : 0;
    var partyBarItems = partyList.slice(0,5).map(function(p){return {name:p.name, val:p.val, valText:'₹'+money(p.val)};});

    // ---- Vehicles grid ----
    html += bizSectionHead('Vehicles', 'vehicles', 'ofl-view-all');
    if(s.totalVehicles===0){
      html += '<div class="biz-empty">No vehicles match the selected filters.</div>';
    } else {
      html += '<div class="biz-grid">';
      html += bizMiniCard('Most profitable vehicle', 'vehicles-profit', bizMiniRankRows(topProfitVeh), '#7CFF6B');
      html += bizMiniCard('Most loss-making vehicle', 'vehicles-loss', bizMiniRankRows(topLossVeh), '#ff5c7a');
      html += bizMiniCard('Best mileage', 'vehicles-mileage', bizMiniRankRows(topMileageVeh), '#4fc3ff');
      html += bizMiniCard('Most trips', 'vehicles-trips', bizMiniRankRows(topTripsVeh), '#ffd166');
      html += bizMiniCard('Travelled the most', 'vehicles-distance', bizMiniRankRows(topDistVeh), '#00e5ff');
      if(s.idleVehicles.length){
        html += bizMiniCard('Idle vehicles', 'vehicles-idle',
          bizMiniHero(String(s.idleVehicles.length), s.idleVehicles.slice(0,5).map(function(t){return t.truckNo;}).join(', ')+(s.idleVehicles.length>5?'…':'')),
          '#8fa3c9');
      }
      html += '</div>';
    }

    // ---- Routes grid ----
    html += bizSectionHead('Routes', 'routes-earning-high', 'ofl-view-all');
    if(!routeRowsAll.length){
      html += '<div class="biz-empty">Log some trips to see route performance.</div>';
    } else {
      html += '<div class="biz-grid">';
      html += bizMiniCard('Highest earning route', 'routes-earning-high', bizMiniRankRows(topEarnRoute), '#7CFF6B');
      html += bizMiniCard('Lowest earning route', 'routes-earning-low', bizMiniRankRows(lowEarnRoute), '#ff5c7a');
      html += bizMiniCard('Runs empty after', 'routes-empty', bizMiniRankRows(emptyRouteRows), '#ffa733');
      html += '</div>';
    }

    // ---- People grid: managers + parties ----
    html += bizSectionHead('Managers & parties', null);
    html += '<div class="biz-grid">';
    if(f.manager==="all"){
      if(mgrSorted.length===0){
        html += bizMiniCard('Best % earning fleet manager', 'managers', '<div class="biz-empty">No manager revenue yet.</div>', '#b98bff');
      } else {
        html += bizMiniCard('Fleet managers — profit margin', 'managers', bizMiniRankRows(topMgrRows), '#b98bff');
      }
    }
    if(partyList.length===0){
      html += bizMiniCard('Revenue by party', 'parties', '<div class="biz-empty">No trips logged yet.</div>', '#00e5ff');
    } else {
      html += bizMiniCard('Revenue by party (top 5)', 'parties', bizMiniBarRows(partyBarItems, maxParty), '#00e5ff');
    }
    html += '</div>';

    // ---- Vehicle table preview ----
    html += bizSectionHead('Top vehicles overview', 'vehicles', 'ofl-view-all');
    var rows = s.scopedTrucks.map(function(t){
      return {
        truck:t, company:companyName(t.companyId), manager:managerOfTruck(t.id)||"—",
        trips:s.vehicleTripCount[t.id]||0, revenue:s.vehicleRevenue[t.id]||0,
        cost:s.vehicleCost[t.id]||0, profit:s.vehicleProfit[t.id]||0, dist:s.vehicleDist[t.id]||0
      };
    }).sort(function(a,b){return b.profit-a.profit;}).slice(0,5);
    if(rows.length===0){
      html += '<div class="biz-empty">No vehicles match the selected filters.</div>';
    } else {
      html += '<div class="mfl-table-wrap" style="background:#0d1326;border-color:#1c2740;"><table class="mfl-table" style="min-width:0;">';
      html += '<thead><tr><th>Vehicle</th><th>Company</th><th>Manager</th><th>Trips</th><th>Distance</th><th>Revenue</th><th>Expenses</th><th>Profit</th></tr></thead><tbody>';
      rows.forEach(function(r){
        var pct = r.revenue>0 ? (r.profit/r.revenue*100).toFixed(1)+'%' : '—';
        html += '<tr data-act="edit-truck" data-id="'+r.truck.id+'">'+
          '<td style="color:#f1f5ff;font-weight:700;">'+esc(r.truck.truckNo)+'</td>'+
          '<td style="color:#c3cee6;">'+esc(r.company)+'</td>'+
          '<td style="color:#c3cee6;">'+esc(r.manager)+'</td>'+
          '<td style="color:#c3cee6;">'+r.trips+'</td>'+
          '<td style="color:#c3cee6;">'+money(r.dist)+' km</td>'+
          '<td style="color:#c3cee6;">₹'+money(r.revenue)+'</td>'+
          '<td style="color:#c3cee6;">₹'+money(r.cost)+'</td>'+
          '<td style="color:'+(r.profit>=0?'#7CFF6B':'#ff5c7a')+';font-weight:700;">'+(r.profit<0?'−':'')+'₹'+money(Math.abs(r.profit))+' <span style="color:#8fa3c9;font-weight:400;">('+pct+')</span></td>'+
        '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '</div>'; // .biz-wrap
    return html;
  }

  ];
  var RTGS_FILTER_KEYS = ["lr","challan","truckNo","from","to","party","brokerName","acName","ewayBillNo","companyId"];

  function findRtgs(id){ return state.rtgsEntries.find(function(x){return x.id===id;}); }
  function rtgsInScope(branchName, companyId){
    return state.rtgsEntries.filter(function(r){
      var okBranch = !branchName || branchName==="__all__" || r.branch===branchName;
      var okCompany = !companyId || companyId==="all" || r.companyId===companyId;
      return okBranch && okCompany;
    });
  }
  function rtgsMatchesFilter(r, q){
    if(!q) return true;
    q = q.toLowerCase();
    return RTGS_COLUMNS.some(function(c){
      if(RTGS_FILTER_KEYS.indexOf(c.key)===-1) return false;
      return String(c.get(r)).toLowerCase().indexOf(q)>-1;
    });
  }
  function sortRtgs(list){
    if(!state.rtgsSortKey) return list;
    var col = RTGS_COLUMNS.find(function(c){return c.key===state.rtgsSortKey;});
    if(!col) return list;
    var dir = state.rtgsSortDir;
    return list.slice().sort(function(a,b){
      var av=col.get(a), bv=col.get(b);
      if(col.numeric) return (av-bv)*dir;
      return String(av).localeCompare(String(bv))*dir;
    });
  }

  function computeBranchStats(filters){
    filters = filters || {};
    var branchFilter = filters.branch || "__all__";
    var dateFrom = filters.dateFrom || "";
    var dateTo = filters.dateTo || "";
    var ewrCo = ewrRoadlinesCompany();
    var companyId = ewrCo ? ewrCo.id : null;

    var rtgsList = state.rtgsEntries.filter(function(r){
      var okBranch = branchFilter==="__all__" || r.branch===branchFilter;
      var okCompany = !companyId || r.companyId===companyId;
      return okBranch && okCompany && inDateRange(r.date, dateFrom, dateTo);
    });
    var beqList = state.branchExpenses.filter(function(r){
      var okBranch = branchFilter==="__all__" || r.branch===branchFilter;
      var okCompany = !companyId || r.companyId===companyId;
      return okBranch && okCompany && inDateRange(r.date, dateFrom, dateTo);
    });

    var branchRevenue={}, branchLorryCost={}, branchOpEx={}, branchTripCount={};
    rtgsList.forEach(function(r){
      var b = r.branch || "Unknown";
      branchRevenue[b] = (branchRevenue[b]||0) + rtgsTotalBooking(r);
      branchLorryCost[b] = (branchLorryCost[b]||0) + rtgsTotalLorry(r);
      branchTripCount[b] = (branchTripCount[b]||0) + 1;
    });
    beqList.forEach(function(r){
      var b = r.branch || "Unknown";
      branchOpEx[b] = (branchOpEx[b]||0) + num(r.amount);
    });

    var allBranchNames = {};
    Object.keys(branchRevenue).forEach(function(b){allBranchNames[b]=true;});
    Object.keys(branchOpEx).forEach(function(b){allBranchNames[b]=true;});
    if(branchFilter!=="__all__") allBranchNames[branchFilter]=true;

    var branchStats = Object.keys(allBranchNames).map(function(b){
      var revenue = branchRevenue[b]||0;
      var lorryCost = branchLorryCost[b]||0;
      var opEx = branchOpEx[b]||0;
      var expense = lorryCost + opEx;
      var profit = revenue - expense;
      var marginPct = revenue>0 ? (profit/revenue*100) : null;
      return {name:b, revenue:revenue, lorryCost:lorryCost, opEx:opEx, expense:expense, profit:profit, marginPct:marginPct, trips:branchTripCount[b]||0};
    });

    var totalRevenue = rtgsList.reduce(function(s,r){return s+rtgsTotalBooking(r);},0);
    var totalLorryCost = rtgsList.reduce(function(s,r){return s+rtgsTotalLorry(r);},0);
    var totalOpEx = beqList.reduce(function(s,r){return s+num(r.amount);},0);
    var totalExpense = totalLorryCost + totalOpEx;
    var totalProfit = totalRevenue - totalExpense;
    var overallMarginPct = totalRevenue>0 ? (totalProfit/totalRevenue*100) : null;

    function bestOf(list, field, wantMax){
      if(!list.length) return null;
      var best = list[0];
      list.forEach(function(b){ if(wantMax ? b[field]>best[field] : b[field]<best[field]) best=b; });
      return best;
    }
    var earners = branchStats.filter(function(b){return b.revenue>0;});
    var margined = branchStats.filter(function(b){return b.marginPct!=null;});

    return {
      branchStats: branchStats,
      totalRevenue: totalRevenue, totalLorryCost: totalLorryCost, totalOpEx: totalOpEx,
      totalExpense: totalExpense, totalProfit: totalProfit, overallMarginPct: overallMarginPct,
      totalTrips: rtgsList.length,
      highestEarningBranch: bestOf(earners, 'revenue', true),
      lowestEarningBranch: bestOf(earners, 'revenue', false),
      highestMarginBranch: bestOf(margined, 'marginPct', true),
      lowestMarginBranch: bestOf(margined, 'marginPct', false)
    };
  }

      html += '<div class="empty">No entries match "'+esc(state.rtgsFilter)+'".</div>';
    } else {
      var perPage = 50;
      var totalPages = Math.max(1, Math.ceil(list.length/perPage));
      if(state.rtgsPage>totalPages) state.rtgsPage = totalPages;
      if(state.rtgsPage<1) state.rtgsPage = 1;
      var startIdx = (state.rtgsPage-1)*perPage;
      var pageList = list.slice(startIdx, startIdx+perPage);
      state.rtgsAllIds = list.map(function(r){ return r.id; });

      var selectedCount = Object.keys(state.rtgsSelected).filter(function(id){ return state.rtgsSelected[id]; }).length;
      if(selectedCount>0){
        html += '<div class="dispatch-bulkbar">'+
          '<span>'+selectedCount+' entr'+(selectedCount>1?'ies':'y')+' selected</span>'+
          '<button class="btn btn-danger" style="width:auto;" data-act="delete-selected-rtgs">'+icon('trash',14)+' Delete selected</button>'+
          '<button class="btn btn-ghost" style="width:auto;" data-act="clear-rtgs-selection">Clear</button>'+
        '</div>';
      }

      html += renderRtgsTableBlock(pageList, {shotId:'rtgs-table-shot', hideExportButtons:true, sortable:true, selectable:true, allIds:state.rtgsAllIds});

      html += '<div class="dispatch-pagination">';
      html += '<div class="muted">Showing '+(startIdx+1)+' to '+Math.min(startIdx+perPage,list.length)+' of '+list.length+' entries</div>';
      html += '<div class="dp-pages">';
      html += '<button class="dp-page-btn" data-act="rtgs-page" data-page="'+(state.rtgsPage-1)+'"'+(state.rtgsPage<=1?' disabled':'')+'>«</button>';
      for(var p=1;p<=totalPages;p++){
        if(p===1 || p===totalPages || Math.abs(p-state.rtgsPage)<=1){
          html += '<button class="dp-page-btn'+(p===state.rtgsPage?' active':'')+'" data-act="rtgs-page" data-page="'+p+'">'+p+'</button>';
        } else if(Math.abs(p-state.rtgsPage)===2){
          html += '<span class="muted" style="padding:0 2px;">…</span>';
        }
      }
      html += '<button class="dp-page-btn" data-act="rtgs-page" data-page="'+(state.rtgsPage+1)+'"'+(state.rtgsPage>=totalPages?' disabled':'')+'>»</button>';
      html += '</div></div>';
    }
    return html;
  }

    html += bizKpi('Profit', (s.totalProfit<0?'−':'')+'₹'+money(Math.abs(s.totalProfit)), 'Revenue − Expense', s.totalProfit>=0?'#7CFF6B':'#ff5c7a');
    html += bizKpi('Margin', s.overallMarginPct==null?'—':s.overallMarginPct.toFixed(1)+'%', null, '#b98bff');
    html += bizKpi('Total Trips', s.totalTrips, null, '#4fc3ff');
    html += '</div>';

    if(s.branchStats.length===0){
      html += '<div class="biz-empty">No Daily Dispatch/RTGS entries or branch expenses in this range yet.</div>';
    } else {
      html += '<div class="biz-grid">';
      if(s.highestEarningBranch) html += bizMiniCard('Highest earning branch', null, bizMiniRankRows([{name:s.highestEarningBranch.name, valText:'₹'+money(s.highestEarningBranch.revenue), color:'#7CFF6B'}]), '#7CFF6B');
      if(s.lowestEarningBranch) html += bizMiniCard('Lowest earning branch', null, bizMiniRankRows([{name:s.lowestEarningBranch.name, valText:'₹'+money(s.lowestEarningBranch.revenue), color:'#ff5c7a'}]), '#ff5c7a');
      if(s.highestMarginBranch) html += bizMiniCard('Highest margin branch', null, bizMiniRankRows([{name:s.highestMarginBranch.name, valText:s.highestMarginBranch.marginPct.toFixed(1)+'%', color:'#7CFF6B'}]), '#b98bff');
      if(s.lowestMarginBranch) html += bizMiniCard('Lowest margin branch', null, bizMiniRankRows([{name:s.lowestMarginBranch.name, valText:s.lowestMarginBranch.marginPct.toFixed(1)+'%', color:'#ff5c7a'}]), '#ffa733');
      html += '</div>';

      html += bizSectionHead('Branches', null);
      var rows = s.branchStats.slice().sort(function(a,b){return b.revenue-a.revenue;});
      html += '<div class="mfl-table-wrap"><table class="mfl-table"><thead><tr>'+
        '<th>Branch</th><th>Trips</th><th>Revenue</th><th>Lorry Cost</th><th>Branch Expense</th><th>Total Expense</th><th>Profit</th><th>Margin %</th>'+
      '</tr></thead><tbody>';
      rows.forEach(function(b){
        html += '<tr>'+
          '<td><b>'+esc(b.name)+'</b></td>'+
          '<td>'+b.trips+'</td>'+
          '<td>₹'+money(b.revenue)+'</td>'+
          '<td>₹'+money(b.lorryCost)+'</td>'+
          '<td>₹'+money(b.opEx)+'</td>'+
          '<td>₹'+money(b.expense)+'</td>'+
          '<td style="color:'+(b.profit>=0?'#7CFF6B':'#ff5c7a')+';font-weight:700;">'+(b.profit<0?'−':'')+'₹'+money(Math.abs(b.profit))+'</td>'+
          '<td>'+(b.marginPct==null?'—':b.marginPct.toFixed(1)+'%')+'</td>'+
        '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '</div>'; // .biz-wrap
    return html;
  }

  // ---------- Excel import for Daily Dispatch & RTGS ----------
  var RTGS_IMPORT_HEADER_MAP = {
    "SR":null, "DATE":"date", "LR":"lr", "CHALLAN":"challan", "TRUCK NO":"truckNo",
    "FROM":"from", "TO":"to", "PARTY":"party", "WEIGHT":"weight",
    "BOOKING RATE":"bookingRate", "TOTAL BOOKING":null,
    "LORRY RATE":"lorryRate", "TOTAL LORRY":null, "MARGIN":null, "MARGIN %":null,
    "ADV IN CASH":"advCash", "TDS":"tds",
    "OTHER EXPENSES":"otherExp1", "EXPENSE TYPE":"expenseType1",
    "OTHER EXPENSES 1":"otherExp1", "EXPENSE TYPE 1":"expenseType1",
    "OTHER EXPENSES 2":"otherExp2", "EXPENSE TYPE 2":"expenseType2",
    "ADV RTGS/CHEQUE":"advRtgs", "LORRY ADVANCE":null, "BALANCE":null,
    "BROKER NAME":"brokerName", "A/C NAME":"acName", "A/C NO":"acNo",
    "IFSC CODE":"ifsc", "PAN NO":"panNo",
    "EWAY BILL NO":"ewayBillNo", "VALID TILL":"validTill", "EWAY EXPIRY":"ewayExpiry"
  };

  async function importRtgsFromExcel(file, branchName, companyId){
    var buf = await file.arrayBuffer();
    var wb = XLSX.read(buf, {type:"array", cellDates:true});
    var sheet = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(sheet, {defval:"", raw:true});

    // Second "DATE" column (RTGS/payment date) shares the header text "DATE"
    // with the first — Excel gives duplicate headers a numeric suffix like
    // "DATE_1" when parsed, so we treat the second one seen as rtgsDate.
    function sig(o){
      return [o.truckNo, o.date, o.lr, o.challan, o.from, o.to, o.party]
        .map(function(x){ return String(x||"").trim().toUpperCase(); }).join("|");
    }
    var existing = {};
    state.rtgsEntries.forEach(function(r){ existing[sig(r)] = true; });

    var added=0, skippedEmpty=0, skippedDup=0;
    for(var rowIdx3=0; rowIdx3<rows.length; rowIdx3++){
      if(rowIdx3>0 && rowIdx3%150===0){ state.rtgsImportNote = "Importing… "+rowIdx3+" of "+rows.length+" rows"; render(); await yieldToBrowser(); }
      var row = rows[rowIdx3];
      var mapped = {};
      var dateSeen = false;
      Object.keys(row).forEach(function(rawKey){
        var norm = normalizeHeader(rawKey.replace(/_\d+$/,""));
        if(norm==="DATE"){
          if(!dateSeen){ mapped.date = row[rawKey]; dateSeen = true; }
          else mapped.rtgsDate = row[rawKey];
          return;
        }
        var field = RTGS_IMPORT_HEADER_MAP[norm];
        if(field) mapped[field] = row[rawKey];
      });
      var hasAnything = Object.keys(mapped).some(function(k){ return mapped[k]!==""; });
      if(!hasAnything){ skippedEmpty++; continue; }

      var entry = {
        id: uid(), branch: branchName, companyId: companyId||"",
        date: excelDateToStr(mapped.date), lr: String(mapped.lr||""), challan: String(mapped.challan||""),
        truckNo: String(mapped.truckNo||""), from: String(mapped.from||""), to: String(mapped.to||""),
        party: String(mapped.party||""), weight: mapped.weight!=null?String(mapped.weight):"",
        bookingRate: mapped.bookingRate!=null?String(mapped.bookingRate):"",
        lorryRate: mapped.lorryRate!=null?String(mapped.lorryRate):"",
        advCash: mapped.advCash!=null?String(mapped.advCash):"", tds: mapped.tds!=null?String(mapped.tds):"",
        otherExp1: mapped.otherExp1!=null?String(mapped.otherExp1):"", expenseType1: String(mapped.expenseType1||""),
        otherExp2: mapped.otherExp2!=null?String(mapped.otherExp2):"", expenseType2: String(mapped.expenseType2||""),
        advRtgs: mapped.advRtgs!=null?String(mapped.advRtgs):"",
        rtgsDate: excelDateToStr(mapped.rtgsDate), brokerName: String(mapped.brokerName||""),
        acName: String(mapped.acName||""), acNo: String(mapped.acNo||""), ifsc: String(mapped.ifsc||""),
        panNo: String(mapped.panNo||""), ewayBillNo: String(mapped.ewayBillNo||""),
        validTill: excelDateToStr(mapped.validTill), ewayExpiry: excelDateToStr(mapped.ewayExpiry),
        createdAt: Date.now(), createdBy: state.session.name, updatedAt: Date.now(), updatedBy: state.session.name
      };
      var s = sig(entry);
      if(existing[s]){ skippedDup++; continue; }
      existing[s] = true;
      state.rtgsEntries.push(entry);
      added++;
    }

    await retrySave(saveRtgsEntries, "import rtgs entries");
    var note = added+" entr"+(added===1?"y":"ies")+" imported for "+branchName+".";
    if(skippedDup>0) note += " "+skippedDup+" row(s) skipped as already in the register.";
    state.rtgsImportNote = note;
    state.rtgsPage = 1;
    render();
  }

        if(!np1 || np1.length<8){ state.error="Password must be at least 8 characters."; render(); return; }

        var meUser = state.users.find(function(x){return x.name===state.session.name;});
        if(meUser){
          meUser.password = np1; // server hashes+salts this before it's ever stored

        }

        goHome();

        render();
