        var fsTarget = t.getAttribute('data-target');
        state.fullscreenTable = state.fullscreenTable===fsTarget ? null : fsTarget;
        render();
      }
      else if(act==="toggle-sidebar-group"){
        // Accordion: opening one ribbon collapses whatever else was open at
        // the same level, so the sidebar never shows two expanded groups (or
        // two expanded sub-groups) at once.
        var gk = t.getAttribute('data-key');
        var wasOpen = state.sidebarOpen[gk]===true;
        var topKeys = state._sidebarTopKeys || [];
        var nestedParent = state._sidebarNestedParent || {};
        if(nestedParent[gk]){
          Object.keys(nestedParent).forEach(function(k){
            if(nestedParent[k]===nestedParent[gk] && k!==gk) state.sidebarOpen[k] = false;
          });
        } else {
          topKeys.forEach(function(k){
            if(k!==gk){
              state.sidebarOpen[k] = false;
              Object.keys(nestedParent).forEach(function(nk){ if(nestedParent[nk]===k) state.sidebarOpen[nk] = false; });
            }
          });
        }
        state.sidebarOpen[gk] = !wasOpen;
        render();
      }
      else if(act==="download-table-image"){
        if(PARTITIONED_KEYS.some(function(k){ return state._rangeLoading[k]; })){
          state.toast = "Please wait — still loading data for the selected date range."; render(); return;
        }
        var shotEl = document.getElementById(t.getAttribute('data-target'));
        if(!shotEl || typeof html2canvas==="undefined"){ state.toast="Download tool load nahi hua, internet check karo."; render(); return; }
        html2canvas(shotEl, {backgroundColor:"#ffffff", scale:2, useCORS:true}).then(function(canvas){
          var link = document.createElement('a');
          link.download = 'fleet-tracking-'+new Date().toISOString().slice(0,10)+'.jpg';
          link.href = canvas.toDataURL('image/jpeg', 0.95);
          link.click();
        }).catch(function(err){ console.error(err); state.toast = "Image download fail hui: "+String((err&&err.message)||err); render(); });
      }
      else if(act==="export-table-excel"){
        if(PARTITIONED_KEYS.some(function(k){ return state._rangeLoading[k]; })){
          state.toast = "Please wait — still loading data for the selected date range."; render(); return;
        }
        var shotEl2 = document.getElementById(t.getAttribute('data-target'));
        var tableEl = shotEl2 ? shotEl2.querySelector('table') : null;
        if(!tableEl || typeof XLSX==="undefined"){ state.toast="Export tool load nahi hua, internet check karo."; render(); return; }
        var wb = XLSX.utils.table_to_book(tableEl, {sheet:"Fleet tracking"});
        XLSX.writeFile(wb, 'fleet-tracking-'+new Date().toISOString().slice(0,10)+'.xlsx');
      }
      else if(act==="dispatch-clear-filters"){
        state.dispatchFilter = "";
        state._rangeExportFrom.trips = "";
        state._rangeExportTo.trips = "";
        state._rangeExportNote.trips = "";
        state.dispatchPage = 1;
        render();
      }
      else if(act==="export-range-excel"){
        var rangeKey = t.getAttribute('data-key');

        if(!rFrom || !rTo){ state._rangeExportNote[rangeKey] = "Pick both a from and to date first."; render(); return; }
        if(rFrom > rTo){ state._rangeExportNote[rangeKey] = "The 'from' date is after the 'to' date."; render(); return; }

        var rMonths = monthsBetween(rFrom, rTo);
        state._rangeLoading[rangeKey] = true; state._rangeExportNote[rangeKey] = ""; render();
        try{ await ensureMonthsLoaded(rangeKey, rMonths); }catch(err){ console.error(err); }
        state._rangeLoading[rangeKey] = false;

          result = writeRangeExcelFile(eRows, eCols, eType, rFrom, rTo);

        var payload = {branch: branchForEntry};

          if(["totalBooking","totalLorry","margin","marginPct","lorryAdvance","balance"].indexOf(c.key)>-1) return;

          var selM = document.getElementById('u-name-manager');
          nm = selM ? selM.value.trim() : "";
          if(!nm){ state.error="Add a fleet manager first, then create this login."; render(); return; }
        } else if(rl==="branch"){
          var selBr = document.getElementById('u-name-branch');
          nm = selBr ? selBr.value.trim() : "";
          if(!nm){ state.error="Add a branch first, then create this login."; render(); return; }
        } else if(rl==="company"){
          var selCo = document.getElementById('u-name-company');
          nm = selCo ? selCo.value.trim() : "";
          if(!nm){ state.error="Add a company first, then create this login."; render(); return; }
        } else {
          nm = document.getElementById('u-name-text').value.trim();
        }
        var pw = document.getElementById('u-pass').value;
        var loginIdEl = document.getElementById('u-login-id');
        var loginId = loginIdEl ? loginIdEl.value.trim() : "";
        if(!nm){ state.error="Name is required."; render(); return; }
        if(!origName && !pw){ state.error="Password is required for a new user."; render(); return; }
        if(pw && pw.length<8){ state.error="Password must be at least 8 characters."; render(); return; }
        if(state.users.some(function(x){return x.name.toLowerCase()===nm.toLowerCase() && x.name.toLowerCase()!==origName.toLowerCase();})){ state.error="A user with that name already exists."; render(); return; }
        if(loginId && state.users.some(function(x){return x.loginId && x.loginId.toLowerCase()===loginId.toLowerCase() && x.name.toLowerCase()!==origName.toLowerCase();})){ state.error="That Login ID is already used by another user."; render(); return; }
        if(loginId && state.users.some(function(x){return x.name.toLowerCase()===loginId.toLowerCase() && x.name.toLowerCase()!==nm.toLowerCase();})){ state.error="That Login ID matches another user's name — pick a different one."; render(); return; }

        var pwHash = pw || null; // sent as plain text over HTTPS; the server hashes+salts it before storing
        if(origName){
          var existingUser = state.users.find(function(x){return x.name===origName;});
          var updated = {name:nm, role:rl, password: pwHash ? pwHash : existingUser.password};
          if(loginId) updated.loginId = loginId;
          // When an admin sets a fresh password for someone (this is our
          // "forgot password" flow — the admin resets it, then the person
          // must immediately choose their own), force a change on next
          // login. Leaving the password blank (unchanged) preserves
          // whatever forced-change state was already pending, if any.
          if(pwHash) updated.mustChangePassword = true;
          else if(existingUser.mustChangePassword) updated.mustChangePassword = true;
          state.users = state.users.map(function(x){return x.name===origName ? updated : x;});
          if(state.session.name===origName) state.session.name = nm;
        } else {
          var newUser = {name:nm, password:pwHash, role:rl};
          if(loginId) newUser.loginId = loginId;
          state.users.push(newUser);
        }
        await saveUsers();
        goBack();
      }
      else if(act==="mgr-select"){ go("managerFleet", {activeManagerName: t.getAttribute('data-name')}, true); }
      else if(act==="save-truck"){
        var guardId = t.getAttribute('data-id');
        if(state.session.role==="manager" && guardId){
          var guardExisting = findTruck(guardId);
          if(guardExisting && !canEditTruck(guardExisting)){
            alert("You can only update vehicles assigned to you.");
            return;
          }
        }
        var id = t.getAttribute('data-id');
        var existing = id ? findTruck(id) : null;
        var rec = existing ? Object.assign({}, existing) : {id:uid(), createdAt:Date.now()};
        function val(fid){ var e2=document.getElementById(fid); return e2? e2.value.trim() : (rec[fid.slice(2)]||""); }
        var newTruckNo = val('f-truckNo');
        if(!newTruckNo){ state.error = "Truck no is required."; render(); return; }
        var dupTruck = state.trucks.find(function(x){
          return x.id!==rec.id && String(x.truckNo||"").trim().toUpperCase()===newTruckNo.toUpperCase();
        });
        if(dupTruck){ state.error = "A vehicle with truck no \""+newTruckNo+"\" already exists. Each vehicle can only be added once."; render(); return; }
        rec.truckNo = newTruckNo;
        rec.loadedFrom = val('f-loadedFrom');
        rec.loadedTo = val('f-loadedTo');
        rec.totalWeight = val('f-totalWeight');
        rec.partyName = val('f-partyName');
        rec.driverName = val('f-driverName');
        rec.companyId = val('f-companyId');
        var csEl = document.getElementById('f-currentStatus');
        rec.currentStatus = csEl ? csEl.value : (rec.currentStatus || "unassigned");
        rec.currentLocation = val('f-currentLocation');
        rec.gpsLocation = val('f-gpsLocation');
        rec.loadingDate = val('f-loadingDate');
        rec.vehicleReachedDate = val('f-vehicleReachedDate');
        rec.remark = val('f-remark');
        rec.updatedAt = Date.now();
        rec.updatedBy = state.session.name;
        if(existing){ state.trucks = state.trucks.map(function(x){return x.id===rec.id?rec:x;}); }
        else{ state.trucks.push(rec); }
        await saveTrucks();
        state.error = "";

        var mgrSel = document.getElementById('f-managerName');
        if(mgrSel){
          var chosenMgr = mgrSel.value;
          var mgrsChanged = false;
          state.managers.forEach(function(m){
            var idx = (m.vehicleIds||[]).indexOf(rec.id);
            if(m.name!==chosenMgr && idx>-1){ m.vehicleIds.splice(idx,1); mgrsChanged = true; }
          });
          if(chosenMgr){
            var target = state.managers.find(function(m){return m.name===chosenMgr;});
            if(target){
              target.vehicleIds = target.vehicleIds || [];
              if(target.vehicleIds.indexOf(rec.id)===-1){ target.vehicleIds.push(rec.id); mgrsChanged = true; }
            }
          }
          if(mgrsChanged) await saveManagers();
        }

        if(resyncDriverManagers()) await saveDrivers();

        if(state.session.role==="driver"){ goHome(); }
        else{ goBack(); }
      }
      else if(act==="toggle-older-months"){
        var omKey = t.getAttribute('data-key');
        state._olderMonthsOpen[omKey] = true;
        state._olderMonthsNote[omKey] = "";
        render();
        if(!state._discoveredMonths[omKey]){
          var discoveredList = await discoverMonthsFor(omKey);
          state._discoveredMonths[omKey] = discoveredList;
          render();
        }
      }
      else if(act==="load-older-month"){
        var lmKey = t.getAttribute('data-key');
        var sel = document.getElementById('older-months-select-'+lmKey);
        if(!sel || !sel.value) return;
        var toLoad = sel.value==="__all__"
          ? (state._discoveredMonths[lmKey]||[]).filter(function(m){ return !state._loadedMonths[lmKey][m]; })
          : [sel.value];
        state._olderMonthsNote[lmKey] = "Loading…";
        render();
        var got = await ensureMonthsLoaded(lmKey, toLoad);
        state._olderMonthsNote[lmKey] = got ? "Loaded." : "Nothing new to load.";
        render();
      }

      }catch(err){
        console.error(err);
        if(!err || !err.handled) state.toast = "Something went wrong — please try again.";
        render();
      }
    };

    el.onchange = function(e){
      if(e.target.id==="filter-status"){ state.filterStatus = e.target.value; render(); }
      if(e.target.id==="filter-manager"){ state.filterManager = e.target.value; render(); }
      if(e.target.id==="ofl-preset"){ state.ownFleetFilters.preset = e.target.value; if(e.target.value!=="custom"){ state.ownFleetFilters.dateFrom=""; state.ownFleetFilters.dateTo=""; } render(); }
      if(e.target.id==="ofl-company"){ state.ownFleetFilters.company = e.target.value; render(); }
      if(e.target.id==="ofl-manager"){ state.ownFleetFilters.manager = e.target.value; render(); }
      if(e.target.id==="ofl-from"){ if(isValidFilterDate(e.target.value)){ state.ownFleetFilters.dateFrom = e.target.value; render(); maybeLoadRangeMonths(['trips','expenses'], state.ownFleetFilters.dateFrom, state.ownFleetFilters.dateTo); } }
      if(e.target.id==="ofl-to"){ if(isValidFilterDate(e.target.value)){ state.ownFleetFilters.dateTo = e.target.value; render(); maybeLoadRangeMonths(['trips','expenses'], state.ownFleetFilters.dateFrom, state.ownFleetFilters.dateTo); } }
      if(e.target.id==="rtgs-branch-select"){ state.activeBranchName = e.target.value; state.rtgsPage=1; state.rtgsSelected={}; render(); }
      if(e.target.id==="beq-branch-select"){ state.beqBranchFilter = e.target.value; render(); }
      if(e.target.id==="beq-date-from"){ if(isValidFilterDate(e.target.value)){ state.beqDateFrom = e.target.value; render(); maybeLoadRangeMonths('branch_expenses', state.beqDateFrom, state.beqDateTo); } }
      if(e.target.id==="beq-date-to"){ if(isValidFilterDate(e.target.value)){ state.beqDateTo = e.target.value; render(); maybeLoadRangeMonths('branch_expenses', state.beqDateFrom, state.beqDateTo); } }
      if(e.target.id==="bdash-branch-select"){ state.branchDashFilters.branch = e.target.value; render(); }
      if(e.target.id==="bdash-date-from"){ if(isValidFilterDate(e.target.value)){ state.branchDashFilters.dateFrom = e.target.value; render(); maybeLoadRangeMonths(['rtgs_entries','branch_expenses'], state.branchDashFilters.dateFrom, state.branchDashFilters.dateTo); } }
      if(e.target.id==="bdash-date-to"){ if(isValidFilterDate(e.target.value)){ state.branchDashFilters.dateTo = e.target.value; render(); maybeLoadRangeMonths(['rtgs_entries','branch_expenses'], state.branchDashFilters.dateFrom, state.branchDashFilters.dateTo); } }
      if(e.target.id==="bizdash-date-from"){ if(isValidFilterDate(e.target.value)){ state.bizFilters.dateFrom = e.target.value; render(); maybeLoadRangeMonths(PARTITIONED_KEYS, state.bizFilters.dateFrom, state.bizFilters.dateTo); } }
      if(e.target.id==="bizdash-date-to"){ if(isValidFilterDate(e.target.value)){ state.bizFilters.dateTo = e.target.value; render(); maybeLoadRangeMonths(PARTITIONED_KEYS, state.bizFilters.dateFrom, state.bizFilters.dateTo); } }
      if(e.target.id.indexOf("rangeexport-from-")===0){
        // Only act once the browser reports a syntactically COMPLETE date.
        // Re-rendering on every partial keystroke (e.g. while the year is
        // still only 1-2 digits typed) would destroy and recreate this
        // input from scratch, wiping out whatever the user had typed so
        // far and making the field appear to "reset" mid-entry.
        if(isValidFilterDate(e.target.value)){
          var refKey = e.target.id.slice("rangeexport-from-".length);
          state._rangeExportFrom[refKey] = e.target.value;
          state._rangeExportNote[refKey] = "";
          render();
        }
      }
      if(e.target.id.indexOf("rangeexport-to-")===0){
        if(isValidFilterDate(e.target.value)){
          var retKey = e.target.id.slice("rangeexport-to-".length);
          state._rangeExportTo[retKey] = e.target.value;
          state._rangeExportNote[retKey] = "";
          render();
        }
      }
      if(e.target.id==="dispatch-company-select"){ state.dispatchCompanyFilter = e.target.value; state.dispatchPage=1; state.dispatchSelected={}; render(); }
      if(e.target.id==="dispatch-manager-select"){ state.activeManagerName = e.target.value; state.dispatchPage=1; state.dispatchSelected={}; render(); }
      if(e.target.id==="f-driverName"){
        var d = state.drivers.find(function(x){return x.name===e.target.value;});
        var mgrSel = document.getElementById('f-managerName');
        if(d && d.managerName && mgrSel){ mgrSel.value = d.managerName; }
      }
      if(e.target.id==="u-role"){
        var fw = document.getElementById('nameFreeWrap');
        var dw = document.getElementById('nameDriverWrap');
        var mw = document.getElementById('nameManagerWrap');
        var bw = document.getElementById('nameBranchWrap');
        var cw = document.getElementById('nameCompanyWrap');
        var v = e.target.value;
        if(fw) fw.style.display = (v!=="driver" && v!=="manager" && v!=="branch" && v!=="company") ? "block" : "none";
        if(dw) dw.style.display = (v==="driver") ? "block" : "none";
        if(mw) mw.style.display = (v==="manager") ? "block" : "none";
        if(bw) bw.style.display = (v==="branch") ? "block" : "none";
        if(cw) cw.style.display = (v==="company") ? "block" : "none";
      }
      if(e.target.id==="logo-file"){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        if(file.size > 1500000){ alert("That image is quite large. Please choose a file under ~1MB."); e.target.value=""; return; }
        var reader = new FileReader();
        reader.onload = async function(){
          state.companyLogo = reader.result;
          await saveLogo();
          render();
        };
        reader.readAsDataURL(file);
      }
      if(e.target.id==="profile-photo-file"){
        var pfile = e.target.files && e.target.files[0];
        if(!pfile) return;
        if(pfile.size > 1500000){ alert("That image is quite large. Please choose a file under ~1MB."); e.target.value=""; return; }
        var preader = new FileReader();
        preader.onload = function(){
          state.photos[photoKey(state.session.role, state.session.name)] = preader.result;
          render();
          retrySave(savePhotos, "save profile photo");
        };
        preader.readAsDataURL(pfile);
      }
      if(e.target.id==="dispatch-import-file"){
        var ifile = e.target.files && e.target.files[0];
        e.target.value = "";
        if(!ifile) return;
        if(!state.activeManagerName){ state.dispatchImportNote = "Select a manager tab first, then upload."; render(); return; }
        if(typeof XLSX==="undefined"){ state.dispatchImportNote = "Import tool didn't load — check your internet connection and try again."; render(); return; }
        state.dispatchImportNote = "Importing…";
        render();
        importTripsFromExcel(ifile, state.activeManagerName).catch(function(err){
          console.error(err);
          state.dispatchImportNote = "Import failed: "+String((err&&err.message)||err);
          render();
        });
      }
      if(e.target.id==="expense-import-file"){
        var efile2 = e.target.files && e.target.files[0];
        e.target.value = "";
        if(!efile2) return;
        if(!state.expenseManagerName){ state.expenseImportNote = "Select a manager tab first, then upload."; render(); return; }
        if(!state.activeExpenseType){ state.expenseImportNote = "Open a specific expense type first, then upload."; render(); return; }
        if(typeof XLSX==="undefined"){ state.expenseImportNote = "Import tool didn't load — check your internet connection and try again."; render(); return; }
        state.expenseImportNote = "Importing…";
        render();
        importExpensesFromExcel(state.activeExpenseType, efile2, state.expenseManagerName).catch(function(err){
          console.error(err);
          state.expenseImportNote = "Import failed: "+String((err&&err.message)||err);
          render();
        });
      }
      if(e.target.id==="rtgs-import-file"){
        var rfile = e.target.files && e.target.files[0];
        e.target.value = "";
        if(!rfile) return;
        if(!state.activeBranchName || state.activeBranchName==="__all__"){ state.rtgsImportNote = "Select a specific branch (not \"All Branch\") first, then upload."; render(); return; }
        var importCoId = (ewrRoadlinesCompany()||{}).id;
        if(!importCoId){ state.rtgsImportNote = "Add the \"East West Roadlines\" company under Admin → Companies first."; render(); return; }
        if(typeof XLSX==="undefined"){ state.rtgsImportNote = "Import tool didn't load — check your internet connection and try again."; render(); return; }
        state.rtgsImportNote = "Importing…";
        render();
        importRtgsFromExcel(rfile, state.activeBranchName, importCoId).catch(function(err){
          console.error(err);
          state.rtgsImportNote = "Import failed: "+String((err&&err.message)||err);
          render();
        });
      }
    };
    el.oninput = function(e){
      if(e.target.id==="search"){ state.search = e.target.value; render();
        var s = document.getElementById('search'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
      }
      if(e.target.id==="dispatch-search"){ state.dispatchFilter = e.target.value; state.dispatchPage = 1; render();
        var ds = document.getElementById('dispatch-search'); if(ds){ ds.focus(); ds.setSelectionRange(ds.value.length,ds.value.length); }
      }
      if(e.target.id==="expense-search"){ state.expenseFilter = e.target.value; state.expensePage = 1; render();
        var es = document.getElementById('expense-search'); if(es){ es.focus(); es.setSelectionRange(es.value.length,es.value.length); }
      }
      if(e.target.id==="rtgs-search"){ state.rtgsFilter = e.target.value; state.rtgsPage = 1; render();
        var rs = document.getElementById('rtgs-search'); if(rs){ rs.focus(); rs.setSelectionRange(rs.value.length,rs.value.length); }
      }
    };

    var statusRow = document.getElementById('status-row');
    if(statusRow){
      statusRow.onclick = function(e){
        var p = e.target.closest('.status-pill');
        if(!p) return;
        var s = p.getAttribute('data-status');
        document.getElementById('f-currentStatus').value = s;
        Array.prototype.forEach.call(statusRow.children, function(c){
          var cs = c.getAttribute('data-status');
          if(cs===s){ c.classList.add('sel'); c.style.background=STATUS_COLOR[cs]; c.style.borderColor=STATUS_COLOR[cs]; }
          else{ c.classList.remove('sel'); c.style.background=''; c.style.borderColor=''; }
        });
      };
    }

    var tpForm = document.getElementById('trip-form-card');
    if(tpForm){
      var tpIds = ['tp-wt','tp-rate','tp-freight','tp-comm','tp-charges','tp-advCash','tp-advRec','tp-tds','tp-balRec','tp-loadingKm','tp-unloadingKm'];
      var tpRecalc = function(changedId){
        var g = function(id){ return document.getElementById(id) ? document.getElementById(id).value : ''; };
        // Freight auto-fills from Rate × Wt whenever either changes and Rate is numeric
        // (a non-numeric rate like "FIX" leaves Freight for manual entry, matching the sheet).
        if(changedId==='tp-wt' || changedId==='tp-rate'){
          var rateVal = g('tp-rate');
          if(rateVal.trim()!=='' && !isNaN(parseFloat(rateVal))){
            document.getElementById('tp-freight').value = (num(rateVal) * num(g('tp-wt'))) || '';
          }
        }
        var fakeTrip = {
          freight: g('tp-freight'), comm: g('tp-comm'), charges: g('tp-charges'),
          advCash: g('tp-advCash'), advRec: g('tp-advRec'), tds: g('tp-tds'), balRec: g('tp-balRec')
        };
        document.getElementById('tp-bal-calc').textContent = '₹'+money(tripBal(fakeTrip));
        document.getElementById('tp-balremaining-calc').textContent = '₹'+money(tripBalRemaining(fakeTrip));
        var dist = num(g('tp-unloadingKm')) - num(g('tp-loadingKm'));
        document.getElementById('tp-totaldist-calc').textContent = (g('tp-loadingKm')||g('tp-unloadingKm')) ? dist+' km' : '—';
      };
      tpIds.forEach(function(id){
        var el = document.getElementById(id);
        if(el) el.addEventListener('input', function(){ tpRecalc(id); });
      });
      tpRecalc(null); // show correct values immediately when editing an existing trip
    }

    var epForm = document.getElementById('expense-form-card');
    if(epForm && state.activeExpenseType){
      var ecfg2 = EXPENSE_TYPES[state.activeExpenseType];
      var autoField = ecfg2.fields.find(function(f){ return f.auto; });
      if(autoField){
        var epRecalc = function(){
          var g2 = function(id){ var el=document.getElementById(id); return el ? el.value : ''; };
          var fake = {};
          ecfg2.fields.forEach(function(f){ if(!f.auto) fake[f.key] = g2('ep-'+f.key); });
          var box = document.getElementById('ep-calc-amount');
          if(box) box.textContent = '₹'+money(expenseAmount(state.activeExpenseType, fake));
        };
        ecfg2.fields.forEach(function(f){
          if(f.auto) return;
          var el = document.getElementById('ep-'+f.key);
          if(el) el.addEventListener('input', epRecalc);
        });
        epRecalc();
      }
    }

    var rtForm = document.getElementById('rtgs-form-card');
    if(rtForm){
      var rtIds = ['rt-weight','rt-bookingRate','rt-lorryRate','rt-advCash','rt-tds','rt-otherExp1','rt-otherExp2','rt-advRtgs'];
      var rtRecalc = function(){
        var g3 = function(id){ var el=document.getElementById(id); return el ? el.value : ''; };
        var fake = {
          weight:g3('rt-weight'), bookingRate:g3('rt-bookingRate'), lorryRate:g3('rt-lorryRate'),
          advCash:g3('rt-advCash'), tds:g3('rt-tds'), otherExp1:g3('rt-otherExp1'), otherExp2:g3('rt-otherExp2'), advRtgs:g3('rt-advRtgs')
        };
        document.getElementById('rt-totalBooking-calc').textContent = '₹'+money(rtgsTotalBooking(fake));
        document.getElementById('rt-totalLorry-calc').textContent = '₹'+money(rtgsTotalLorry(fake));
        document.getElementById('rt-margin-calc').textContent = '₹'+money(rtgsMargin(fake));
        document.getElementById('rt-marginPct-calc').textContent = rtgsMarginPct(fake).toFixed(1)+'%';
        document.getElementById('rt-lorryAdvance-calc').textContent = '₹'+money(rtgsLorryAdvance(fake));
        document.getElementById('rt-balance-calc').textContent = '₹'+money(rtgsBalance(fake));
      };
      rtIds.forEach(function(id){
        var elx = document.getElementById(id);
        if(elx) elx.addEventListener('input', rtRecalc);
      });
      rtRecalc();
    }
  }

  // No data is fetched until after a successful login (the server won't
  // hand any of it over without a valid session token) — so at boot we just
  // show the login screen immediately, instead of loading data first.
  state.booted = true;
  render();
  applyTheme();

  // ---------- PWA: service worker + "Install app" support ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
  var deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    state.canInstallApp = true;
    render();
  });
  window.installFleetApp = function(){
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){
      deferredInstallPrompt = null;
      state.canInstallApp = false;
      render();
    });
  };
})();
</script>
